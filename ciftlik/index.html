function collide(px,pz,r,list){

    const cx=clamp(px,c.x0,c.x1),cz=clamp(pz,c.z0,c.z1);const dx=px-cx,dz=pz-cz,d2=dx*dx+dz*dz;

  return [px,pz];

function segHit(ax,ay,az,bx,by,bz,skip){

const pickables=[];
function bInside(B,x,z,m=0){return x>B.x0+m&&x<B.x1-m&&z>B.z0+m&&z<B.z1-m}
function doorPts(B,d){const o=1.1;switch(d.side){case's':return [[d.c,B.z1+o],[d.c,B.z1-o]];case'n':return [[d.c,B.z0-o],[d.c,B.z0+o]];case'e':return [[B.x1+o,d.c],[B.x1-o,d.c]];default:return [[B.x0-o,d.c],[B.x0+o,d.c]]}}
function planPath(pid,x,z,tx,tz){const B=PENS[pid].bld;if(!B||B.open)return [[tx,tz]];const ai=bInside(B,x,z),ti=bInside(B,tx,tz);if(ai===ti)return [[tx,tz]];
  let best=null,bd=1e9;for(const d of B.doors){const [o,i]=doorPts(B,d);const dd=Math.hypot(o[0]-tx,o[1]-tz)+Math.hypot(o[0]-x,o[1]-z);if(dd<bd){bd=dd;best=[o,i]}}
  return ai?[best[1],best[0],[tx,tz]]:[best[0],best[1],[tx,tz]]}
function penRandPos(pid,m=.9,inside){const P=PENS[pid],B=P.bld;if(inside&&B)return [rand(B.x0+m,B.x1-m),rand(B.z0+m+(pid==='kumes'?.6:0),B.z1-m)];return [P.x+rand(-P.w/2+m,P.w/2-m),P.z+rand(-P.d/2+m,P.d/2-m)]}

  R.g.traverse(o=>{o.userData.aid=a.id});scene.add(R.g);pickables.push(R.g);
  a._v={R,h,path:[],wait:rand(3),ph:rand(6),goal:null,eat:0,graze:0,ic:null,icKey:'',stuck:0,lastD:1e9,hold:0};
}
function killVis(a){if(!a._v)return;scene.remove(a._v.R.g);const i=pickables.indexOf(a._v.R.g);if(i>=0)pickables.splice(i,1);if(a._v.ic)a._v.ic.remove();a._v=null}
function setTarget(a,tx,tz){const v=a._v;v.path=planPath(penOf(a),a.x,a.z,tx,tz);v.stuck=0;v.lastD=1e9}
function updateAnimalVis(a,dt,night){
  const v=a._v;if(!v)return;const d=AT[a.t],R=v.R,pid=penOf(a),P=PENS[pid];

    else{const want=Math.atan2(dz,dx);v.h=angLerp(v.h,want,Math.min(1,dt*4));const df=Math.abs(Math.atan2(Math.sin(want-v.h),Math.cos(want-v.h)));
      const sp=d.hiz*(night?.6:1)*(df>1?.3:1)*(v.goal?1.25:1)*(a.trait==='tembel'?.6:1);a.x+=Math.cos(v.h)*sp*dt;a.z+=Math.sin(v.h)*sp*dt;moving=true;

  const nearP=!R.small&&Math.abs(a.x-PL.x)<22&&Math.abs(a.z-PL.z)<22;if(v.cs!==nearP){v.cs=nearP;R.g.traverse(o=>{if(o.isMesh)o.castShadow=nearP})}
  if(R.gl){const sp=moving?d.hiz*(night?.6:1):0;R.g.visible=Math.hypot(a.x-PL.x,a.z-PL.z)<75;glAnim(R,dt,moving?((v.goal&&sp>1.2)?'Gallop':'Walk'):(v.eat>0||v.graze>0)?'Eating':(v.hold>0?'Idle':(Math.sin(performance.now()/4000+a.id)>.75?'Idle_2':'Idle')),moving?clamp(sp/Math.max(.5,d.hiz),.6,1.5):1);return}
  v.ph+=dt*(moving?d.hiz*7*(R.kind==='chicken'?1.8:1):0);
  const sw=moving?Math.sin(v.ph)*.55:0;
  if(R.legs.length===4){R.legs[0].rotation.z=sw;R.legs[3].rotation.z=sw;R.legs[1].rotation.z=-sw;R.legs[2].rotation.z=-sw}
  else if(R.legs.length===2){R.legs[0].rotation.z=sw;R.legs[1].rotation.z=-sw}
  const t=performance.now()/1000;const pdist=Math.hypot(a.x-PL.x,a.z-PL.z);R.g.visible=pdist<75;
  R.body.position.y=moving?Math.abs(Math.cos(v.ph))*.03:0;
  if(R.waddle)R.body.rotation.x=moving?Math.sin(v.ph)*.14:0;else R.body.scale.y=1+Math.sin(t*1.6+a.id)*.012;
  if(!R.waddle){const pg=a.preg!=null&&d.gebelik?clamp(a.preg/d.gebelik,0,1):0;R.body.scale.z=1+pg*.14}
  let hy=0;if(pdist<4.5&&!moving&&v.eat<=0&&v.graze<=0){const ang=Math.atan2(PL.z-a.z,PL.x-a.x);hy=clamp(Math.atan2(Math.sin(ang-v.h),Math.cos(ang-v.h)),-.7,.7)}
  R.head.rotation.y=lerp(R.head.rotation.y,-hy,Math.min(1,dt*4));
  let hr=0;
  if(v.eat>0||v.graze>0){if(v.graze>0)v.graze-=dt;hr=(R.kind==='chicken'||R.kind==='goose')?-.8-Math.abs(Math.sin(t*9))*.45:(R.kind==='horse'?-1.15:R.kind==='cow'?-.95:-1.05)+Math.sin(t*3)*.06}
  else if(R.kind==='chicken'&&!moving)hr=Math.sin(t*2+a.id)*.15+(Math.sin(t*.7+a.id*3)>.7?-.9:0);
  else if(v.hold>0)hr=Math.sin(t*1.5)*.1+.1;
  else hr=Math.sin(t*.8+a.id)*.08;
  R.head.rotation.z=lerp(R.head.rotation.z,hr,Math.min(1,dt*8));
  if(R.tail)R.tail.rotation.x=Math.sin(t*2.2+a.id)*.35;
  if(R.wool&&d.yun){const s=a.wr?1:.72+.28*clamp(a.wp/d.yun.aralik,0,1);R.wool.scale.set(1,s*.9+.1,s)}
}
function goTo(a,goal){const v=a._v,P=PENS[penOf(a)],F=goal==='feed'?P.fd:P.tr,L=F.l*.42;
  v.goal=goal;setTarget(a,F.x+rand(-L,L),F.z+F.s*(.6+AT[a.t].r*.85));v.wait=0;v.eat=0;v.graze=0}

  const by={};for(const a of S.animals){if(!a._v)continue;(by[penOf(a)]||(by[penOf(a)]=[])).push(a)}

    const pdx=A.x-PL.x,pdz=A.z-PL.z,pd=Math.hypot(pdx,pdz),pm=AT[A.t].r*.8+.35;if(pd<pm&&pd>1e-4){A.x+=pdx/pd*(pm-pd);A.z+=pdz/pd*(pm-pd)}
    for(let j=i+1;j<L.length;j++){const B=L[j],dx=B.x-A.x,dz=B.z-A.z,d=Math.hypot(dx,dz),m=AT[A.t].r+AT[B.t].r;if(d<m&&d>1e-4){const p=(m-d)/d*.25;A.x-=dx*p;A.z-=dz*p;B.x+=dx*p;B.z+=dz*p}}}}

const cnt=t=>S.animals.filter(a=>a.t===t).length;
const penCount=pid=>S.animals.filter(a=>penOf(a)===pid).length;
const penCap=pid=>PENS[pid].cap[S.pens[pid].lvl];
const depoCap=()=>DEPO[S.depo];
const depoUsed=()=>{let s=0;for(const k in S.prod)s+=S.prod[k];return s};
const hour=()=>S.t*24;
const isNight=()=>{const h=hour();return h<5.5||h>=20.5};
function addProd(k,n){const room=depoCap()-depoUsed();const add=Math.min(n,Math.max(0,room));if(add<=0)return 0;S.prod[k]=Math.round((S.prod[k]+add)*10)/10;return add}
function eat(a){const d=AT[a.t],p=S.pens[penOf(a)];if(p.feed>=d.ogun){p.feed-=d.ogun;a.hu=Math.min(100,a.hu+50)}}
function drink(a){const d=AT[a.t],p=S.pens[penOf(a)];if(p.water>=d.su){p.water-=d.su;a.th=Math.min(100,a.th+55)}}
const wt={b:0,s:0,v:0};let LIVE=false,READY=false;
function sim(dt,live){
  LIVE=live;const prevT=S.t;S.t+=dt/DAY;
  if(prevT<.75&&S.t>=.75&&S.wk.pazarci)sellAll(.05,true);
  if(S.t>=1){S.t-=1;newDay()}
  const k=(isNight()?.5:1)*.5;
  for(const id of PEN_IDS){const p=S.pens[id];if(p.un&&p.auto)p.water=PENS[id].waterCap}
  for(const a of [...S.animals]){
    const d=AT[a.t],pid=penOf(a),p=S.pens[pid];
    a.hu=Math.max(0,a.hu-.4*k*dt*(a.trait==='obur'?1.3:1));a.th=Math.max(0,a.th-.5*k*dt);a.ag+=dt;
    const busy=live&&a._v&&(a._v.goal||a._v.hold>0||a._v.mig);
    if(pid==='yayla'){a.hu=Math.min(100,a.hu+1.1*dt);a.th=Math.min(100,a.th+1.1*dt)}
    else if(!busy){
      if(a.hu<60&&p.feed>=d.ogun){if(live&&a._v)goTo(a,'feed');else eat(a)}
      else if(a.th<60&&p.water>=d.su){if(live&&a._v)goTo(a,'water');else drink(a)}
    }
    if(a.hu<=0||a.th<=0)a.hp-=.07*dt;else if(!a.sick)a.hp=Math.min(100,a.hp+.04*dt);
    a.hp=Math.max(0,a.hp);
    if(a.hp<30&&!a.sick){a.sick=1;if(live)toast(`🤒 ${a.n} (${d.ad}) hastalandı! Veteriner gerekiyor.`)}
    const ok=!a.sick&&a.hu>25&&a.th>25,mood=(a.hu+a.th+a.hp)/300,rate=dt*(.5+mood*.7)*animalMult(a);
    if(d.buyur&&a.ag>=d.buyume){grow(a,live);continue}
    const male=a.sex==='e';
    if(ok&&d.urun&&!a.rd&&!(male&&d.sagim)){a.pr+=rate;if(a.pr>=d.aralik){if(dayOk(a,d)){a.pr=0;markDay(a);
      if(a.t==='tavuk'){if(p.eggs+p.geggs<300)p.eggs++}else if(a.t==='kaz'){if(p.eggs+p.geggs<300)p.geggs++}else a.rd=1}else a.pr=d.aralik}}
    if(ok&&d.yun&&!a.wr){a.wp+=rate;if(a.wp>=d.yun.aralik)a.wr=1}
    if(ok&&d.gelir){a.pr+=rate;if(a.pr>=d.gelir.aralik&&dayOk(a,d)){a.pr=0;markDay(a);S.money+=d.gelir.miktar;if(live)floatAt(a,'+'+tl(d.gelir.miktar)+' 🏇')}}
    // yavrulama artık gebelik sistemiyle (günlük)
  }
  lifeSim(dt,live,prevT);fieldSim(dt,live);
  workerSim(dt,live);
}
function workerSim(dt){
  const W=S.wk;
  if(W.bakici){wt.b+=dt;const iv=4/W.bakici;while(wt.b>=iv){wt.b-=iv;bakiciJob()}}else wt.b=0;
  if(W.sagimci){wt.s+=dt;const iv=2.5/W.sagimci;while(wt.s>=iv){wt.s-=iv;sagimciJob()}}else wt.s=0;
  if(W.veteriner){wt.v+=dt;if(wt.v>=5){wt.v=0;const a=S.animals.find(a=>a.sick);if(a)heal(a,0)}}
}
let feedWarnDay=0;
function bakiciJob(){
  for(const id of PEN_IDS){const p=S.pens[id],P=PENS[id];if(!p.un)continue;
    if(p.water<P.waterCap*.5){p.water=P.waterCap;return}
    if(p.feed<P.feedCap*.5&&penCount(id)){if(S.feed[P.feed]>0){const take=Math.min(P.feedCap-p.feed,S.feed[P.feed]);S.feed[P.feed]=Math.round((S.feed[P.feed]-take)*100)/100;p.feed+=take;return}else if(feedWarnDay!==S.day&&LIVE){feedWarnDay=S.day;toast(`🧑‍🌾 Bakıcı: "Ambarda ${FEED[P.feed].ad.toLocaleLowerCase('tr')} kalmadı patron!"`)}}}
}
function sagimciJob(){
  for(const id of PEN_IDS){const p=S.pens[id];if(p.eggs+p.geggs>0&&depoUsed()<depoCap()){collectEggs(id,true);return}}
  const a=S.animals.find(a=>a.rd&&!a.sick)||S.animals.find(a=>a.wr);
  if(a&&depoUsed()<depoCap()){if(a.rd)milk(a,true);else shear(a,true)}
}
function newDay(){
  S.day++;let wages=0;for(const k in WK)wages+=WK[k].maas*S.wk[k];
  const quit=[];
  while(wages>0&&S.money<wages){const ks=Object.keys(WK).filter(k=>S.wk[k]>0).sort((a,b)=>WK[b].maas-WK[a].maas);if(!ks.length)break;S.wk[ks[0]]--;wages-=WK[ks[0]].maas;quit.push(WK[ks[0]].ad)}
  S.money-=wages;
  for(const k in PR)S.pm[k]=clamp(S.pm[k]*rand(.86,1.16)*(1+(1-S.pm[k])*.3),.7,1.4);
  onNewDay();
  if(LIVE){toast(`🌅 Gün ${S.day} başladı${wages?` · Maaşlar: -${tl(wages)}`:''}`);if(quit.length)toast(`😞 Maaş ödenemedi: ${quit.join(', ')} işi bıraktı.`)}
  if(quit.length)syncHumans();
}

  if(READY)spawnVis(b);if(live){toast(`🍼 ${par.n} bir ${AT[b.t].ad.toLocaleLowerCase('tr')} doğurdu! Adı: ${b.n}`);floatAt(b,'🎉')}}

/* ================= eylemler ================= */
function canPay(n){if(S.money>=n)return true;toast('💸 Paran yetmiyor!');if(n-S.money>2000&&!S.shopHint){S.shopHint=1;setTimeout(()=>modal(`<h2>💸 Biraz eksik kaldı</h2><p>Bu iş için ${tl(n-S.money)} daha lazım. Sabırla biriktirebilir ya da istersen Google Play mağazasından bir kese alıp hızlanabilirsin.</p><div class="btns"><button class="btn gold" data-act="toshop">💎 Mağazaya bak</button><button class="btn alt" data-act="closemodal">Biriktireceğim</button></div>`),600)}return false}
function buyAnimal(t,sex){sex=sex||'d';const d=AT[t],pid=d.pen;const fiyat=aPrice(t,sex);if(!S.pens[pid].un)return toast(`🔒 Önce ${PENS[pid].ad} açılmalı.`);if(penCount(pid)>=penCap(pid))return toast(`${PENS[pid].ad} dolu! Telefondan genişletebilirsin.`);if(!canPay(fiyat))return;
  S.money-=fiyat;const [x,z]=penRandPos(pid);const a=newAnimal(t,x,z,sex);S.animals.push(a);spawnVis(a);toast(`${d.e} ${a.n} adında bir ${aName(a).toLocaleLowerCase('tr')} aldın! Hayvan ${PENS[pid].ad.toLocaleLowerCase('tr')} bölmesine teslim edildi.`);refresh()}
function buyFeed(k,i){const [kg,pr]=FEED[k].paket[i];if(S.feed[k]+kg>FEED[k].cap)return toast(`Ambar dolu (en fazla ${FEED[k].cap} kg).`);if(!canPay(pr))return;S.money-=pr;S.feed[k]+=kg;toast(`${FEED[k].e} ${kg} kg ${FEED[k].ad.toLocaleLowerCase('tr')} yem ambarına teslim edilecek.`);refresh()}
function collectEggs(pid,silent){const p=S.pens[pid];if(p.eggs+p.geggs<=0)return;let a=addProd('yumurta',p.eggs);p.eggs-=a;let b=addProd('kazYumurta',p.geggs);p.geggs-=b;S.stats.eggs+=a+b;
  if(!silent){if(a+b<=0)return toast('📦 Depo dolu! Pazarda ürün sat ya da depoyu büyüt.');floatWorld(penObj[pid].nest.clone().setY(1.6),`+${a+b} 🥚`);refresh()}}
function milk(a,silent){if(!a.rd)return;const d=AT[a.t];const amt=d.miktar*(S.sagimMak?1.3:1);const got=addProd(d.urun,amt);if(got<=0){if(!silent)toast('📦 Depo dolu! Pazarda ürün sat ya da depoyu büyüt.');return}
  a.rd=0;S.stats.milk+=got;S.stats.milkings++;if(LIVE&&a._v)floatAt(a,`+${f1(got)} L 🥛`);if(!silent)refresh()}
function shear(a,silent){if(!a.wr)return;const got=addProd('yun',AT[a.t].yun.miktar);if(got<=0){if(!silent)toast('📦 Depo dolu!');return}a.wr=0;a.wp=0;S.stats.wool+=got;if(LIVE&&a._v)floatAt(a,`+${f1(got)} kg 🧶`);if(!silent)refresh()}
function heal(a,cost){if(!a.sick)return;if(cost&&!canPay(cost))return;S.money-=cost;a.sick=0;a.hp=80;a.hu=Math.max(a.hu,40);a.th=Math.max(a.th,40);if(LIVE){toast(`🧑‍⚕️ ${a.n} iyileşti!`);if(a._v)floatAt(a,'💚')}refresh()}
function animalValue(a){const d=AT[a.t];return Math.round(d.fiyat*(a.sick?.3:.65)*(.5+a.hp/200))}
function sellAnimal(a){const v=animalValue(a);S.money+=v;killVis(a);S.animals=S.animals.filter(x=>x!==a);toast(`${AT[a.t].e} ${a.n} satıldı: +${tl(v)}`);deselect();refresh()}
function price(k){return PR[k].f*S.pm[k]*(UI.p==='market'&&UI.boost?1.3:1)}
function sell(k,fee=0){const n=S.prod[k];if(n<=0)return 0;const m=n*price(k)*(1-fee)*(S.usta?1.2:1);S.money+=m;S.stats.sold+=m;S.prod[k]=0;return m}
function sellAll(fee,auto){let m=0;for(const k in PR)m+=sell(k,fee);if(m>0&&LIVE)toast(auto?`🧔 Pazarcı ürünleri sattı: +${tl(m)}`:`💰 Hepsi satıldı: +${tl(m)}`);if(!auto&&m<=0)toast('Depoda satılacak ürün yok.');refresh();return m}
function unlockPen(pid){const P=PENS[pid];if(S.pens[pid].un)return;if(!canPay(P.unlock))return;S.money-=P.unlock;S.pens[pid].un=1;penObj[pid].sign.visible=false;toast(`🎉 ${P.ad} artık senin!`);refresh()}
function upgradePen(pid){const p=S.pens[pid],P=PENS[pid];if(p.lvl>=P.cap.length-1)return;const c=P.capCost[p.lvl+1];if(!canPay(c))return;S.money-=c;p.lvl++;applyLvl(pid);toast(`🔨 ${P.ad} genişletildi: ${penCap(pid)} hayvan kapasitesi.`);S.animals.forEach(a=>a.fullWarn=0);refresh()}
function buyAuto(pid){const p=S.pens[pid],P=PENS[pid];if(p.auto)return;if(!canPay(P.autoCost))return;S.money-=P.autoCost;p.auto=1;toast(`🚰 ${P.ad} için otomatik suluk kuruldu.`);refresh()}
function upgradeDepo(){if(S.depo>=DEPO.length-1)return;const c=DEPO_COST[S.depo+1];if(!canPay(c))return;S.money-=c;S.depo++;toast(`📦 Depo büyütüldü: ${depoCap()} birim.`);refresh()}
function buySagimMak(){if(S.sagimMak)return;if(!canPay(SAGIM_MAK))return;S.money-=SAGIM_MAK;S.sagimMak=1;toast('⚙️ Sağım makinesi kuruldu: %30 daha fazla süt!');refresh()}
function hire(k){const w=WK[k];if(S.wk[k]>=w.max)return;if(!canPay(w.ucret))return;S.money-=w.ucret;S.wk[k]++;toast(`${w.e} Yeni ${w.ad.toLocaleLowerCase('tr')} işe başladı!`);syncHumans();refresh()}
function fire(k){if(S.wk[k]<=0)return;S.wk[k]--;toast(`${WK[k].e} Bir ${WK[k].ad.toLocaleLowerCase('tr')} işten ayrıldı.`);syncHumans();refresh()}

const Q=[
  {t:'Köy pazarına yürü, 3 tavuk al',c:()=>cnt('tavuk')>=3,p:()=>`${Math.min(3,cnt('tavuk'))}/3`,r:150,w:SPOT.market},
  {t:'Yem ambarından tahıl çuvalı al, kümesin yemliğine dök',c:()=>S.stats.fed>=1,r:80,w:()=>S.carry?[PENS.kumes.fd.x,PENS.kumes.fd.z]:SPOT.ambarT},
  {t:'Kümesin içindeki folluklardan 10 yumurta topla',c:()=>S.stats.eggs>=10,p:()=>`${Math.min(10,S.stats.eggs)}/10`,r:100,w:[-24,-12.5]},
  {t:'Pazarda ürünlerini sat',c:()=>S.stats.sold>=100,p:()=>`${tl(Math.min(100,S.stats.sold))}/100₺`,r:150,w:SPOT.market},

  {t:'Ahırı satın al',c:()=>S.pens.ahir.un,r:600,w:()=>penObj.ahir.signPos},
  {t:'İlk ineğini al',c:()=>cnt('inek')>=1,r:600,w:SPOT.market},
  {t:'Bir yavru doğsun',c:()=>S.stats.born>=1,r:800},

  {t:'İlk atını al',c:()=>cnt('at')>=1,r:1500,w:SPOT.market},

  {t:'50.000₺ biriktir',c:()=>S.money>=50000,p:()=>`${tl(S.money)}`,r:5000},
];
function questTarget(){const q=Q[S.q];if(!q||!q.w)return null;return typeof q.w==='function'?q.w():q.w}
function checkQuest(){while(S.q<Q.length&&Q[S.q].c()){const q=Q[S.q];S.money+=q.r;S.q++;toast(`🎯 Görev tamam: ${q.t} · Ödül +${tl(q.r)}`)}
  const el=$('hQuest');if(S.q>=Q.length){setHTML(el,'🏆 Tüm görevler tamam! Çiftliğin harika.');return}const q=Q[S.q];const w=questTarget();const dist=w?Math.round(Math.hypot(w[0]-PL.x,w[1]-PL.z)):0;
  setHTML(el,`🎯 ${esc(q.t)}${q.p?` <small>(${q.p()})</small>`:''}${w&&dist>4?` <small>· 📍${dist} m</small>`:''}`)}

let SEL=null,UI={p:null,tab:null},pdown=false;
function setHTML(el,h){if(el._h!==h){el._h=h;el.innerHTML=h}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;const T=$('toasts');T.appendChild(t);while(T.children.length>3)T.firstChild.remove();setTimeout(()=>t.remove(),3400)}
const floats=[];
function floatWorld(p,txt){const el=document.createElement('div');el.className='ft';el.textContent=txt;$('icons').appendChild(el);floats.push({el,p:p.clone(),t:0})}
function floatAt(a,txt){floatWorld(new THREE.Vector3(a.x,(a._v?a._v.R.h:1)+.3,a.z),txt)}
function bar(v,max=100,col){const p=clamp(v/max*100,0,100);const c=col||(p<25?'#c0392b':p<50?'#d99a1e':'#3f7d2c');return `<div class="bar"><i style="width:${p}%;background:${c}"></i></div>`}
function refresh(){updateHUD();if(UI.p)renderSheet();if(SEL)renderCard()}
function updateHUD(){
  $('hMoney').textContent=tl(S.money);const h=hour(),hh=Math.floor(h),mm=Math.floor((h-hh)*6)*10;
  $('hTime').textContent=`${isNight()?'🌙':h<8||h>18.5?'🌅':'☀️'} Gün ${S.day} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  $('hDepo').textContent=`📦 ${Math.floor(depoUsed())}/${depoCap()}`;
  const al=[];
  for(const id of PEN_IDS){const p=S.pens[id],P=PENS[id];if(!p.un||!penCount(id))continue;const fa=S.animals.find(a=>AT[a.t].pen===id);if(p.feed<AT[fa.t].ogun)al.push(`⚠️ ${P.ad}: yemlik boş`);else if(p.water<P.waterCap*.1)al.push(`⚠️ ${P.ad}: su bitti`)}
  const sick=S.animals.filter(a=>a.sick).length;if(sick)al.push(`🤒 ${sick} hasta hayvan`);
  if(depoUsed()>=depoCap())al.push('📦 Depo dolu: pazarda sat');
  for(const p of PREDS)if(p.st!=='flee')al.unshift(p.k==='tilki'?'🦊 Tilki kümese dadandı!':'🐺 Kurt sürüye yaklaşıyor!');
  const due=S.orders.filter(o=>o.day===S.day).length;if(due)al.push(`📋 ${due} sipariş bugün bitiyor`);
  setHTML($('alerts'),al.slice(0,3).map(t=>`<div class="chip">${t}</div>`).join(''));
}
function openSheet(p,tab){UI.boost=false;UI.p=p;UI.tab=tab||({market:'animals',phone:'farm'})[p];deselect();$('sheet').classList.remove('hidden');$('shBody').scrollTop=0;renderSheet()}

    else{body=`<div class="item"><div class="ib"><b>Depo: ${Math.floor(depoUsed())}/${depoCap()}</b>${bar(depoUsed(),depoCap(),depoUsed()>=depoCap()?'#c0392b':'#3f7d2c')}<small>Fiyatlar her gün değişir. Ucuz günde bekle, pahalı günde sat!</small></div></div>`+
      Object.keys(PR).map(k=>{const P=PR[k],n=S.prod[k],pr=price(k),tr=S.pm[k]>1.04?`<span class="up">▲ %${Math.round((S.pm[k]-1)*100)}</span>`:S.pm[k]<.96?`<span class="down">▼ %${Math.round((1-S.pm[k])*100)}</span>`:'<span>—</span>';

    if(UI.tab==='farm'){body=`<div class="sec">Depo · ${Math.floor(depoUsed())}/${depoCap()}</div><div class="item" style="display:block">${Object.keys(PR).map(k=>`<div class="stat"><span>${PR[k].e} ${PR[k].ad}</span><b>${f1(S.prod[k])} ${PR[k].b}</b></div>`).join('')}</div>
      <div class="sec">Yem ambarı</div><div class="item" style="display:block">${Object.keys(FEED).map(k=>`<div class="stat"><span>${FEED[k].e} ${FEED[k].ad}</span><b>${f1(S.feed[k])} kg</b></div>`).join('')}</div><div class="sec">Bölmeler</div>`+
      PEN_IDS.map(id=>{const q=S.pens[id],P=PENS[id];if(!q.un)return `<div class="item"><div class="ie">🔒</div><div class="ib"><b>${P.ad}</b><small>Tabelasına git ya da Geliştir'den aç: ${tl(P.unlock)}</small></div></div>`;
        return `<div class="item" style="display:block"><div style="display:flex;gap:10px;align-items:center"><div class="ie">${P.e}</div><div class="ib"><b>${P.ad}</b><small>${penCount(id)}/${penCap(id)} hayvan${id==='kumes'?` · 🥚 ${q.eggs+q.geggs} yumurta bekliyor`:''}</small></div></div><div class="bars"><div><label><span>${FEED[P.feed].e} Yemlik</span><span>${f1(q.feed)}/${P.feedCap}</span></label>${bar(q.feed,P.feedCap)}</div><div><label><span>💧 Su</span><span>${Math.round(q.water)}/${P.waterCap}</span></label>${bar(q.water,P.waterCap,'#3a87b8')}</div></div></div>`}).join('')}

document.addEventListener('pointerdown',e=>{if(e.target.closest('.sheet,.card'))pdown=true},true);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const D=b.dataset,a=S.animals.find(x=>x.id===SEL);
  switch(D.act){
    case'action':doAction();break;
    case'drop':if(S.carry){S.feed[S.carry.k]+=S.carry.kg;toast(`${FEED[S.carry.k].e} Yükü bıraktın, ambara geri kondu.`);S.carry=null}break;

    case'close':closeSheet();break;case'tab':UI.tab=D.t;renderSheet();break;
    case'buy':buyAnimal(D.t,D.s);break;case'feed':buyFeed(D.k,+D.i);break;
    case'sell':{const m=sell(D.k);if(m)toast(`💰 +${tl(m)}`);refresh();break}
    case'sellall':sellAll(0,false);break;
    case'unlock':unlockPen(D.id);break;case'upgrade':upgradePen(D.id);break;case'auto':buyAuto(D.id);break;
    case'depo':upgradeDepo();break;case'sagimmak':buySagimMak();break;
    case'hire':hire(D.k);break;case'fire':fire(D.k);break;
    case'desel':deselect();break;case'heal':if(a)heal(a,VET_COST);break;
    case'sellan':if(a){if(D.c==='0'){b.dataset.c='1';b.textContent=`Emin misin? ${tl(animalValue(a))}`;b.classList.remove('alt');b.classList.add('red');pdown=true;setTimeout(()=>pdown=false,2500)}else sellAnimal(a)}break;

    case'quests':modal(`<h2>🎯 Görevler</h2>${Q.map((q,i)=>`<div class="stat"><span>${i<S.q?'✅':i===S.q?'👉':'⬜'} ${esc(q.t)}</span><b>+${tl(q.r)}</b></div>`).join('')}<button class="btn" style="width:100%;margin-top:12px" data-act="closemodal">Tamam</button>`);break;
    case'q':S.quality=+D.v;save();location.reload();break;
    case'reset':if(D.c==='0'){b.dataset.c='1';b.textContent='Her şey silinecek, emin misin?';pdown=true;setTimeout(()=>pdown=false,3000)}else{try{localStorage.removeItem(KEY)}catch(e){}S=newState();S.welcomed=1;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}location.reload()}break;

const C={dTop:new THREE.Color('#3f80cf'),dBot:new THREE.Color('#cfe4f1'),sTop:new THREE.Color('#41558a'),sBot:new THREE.Color('#f2a66b'),nTop:new THREE.Color('#060a1a'),nBot:new THREE.Color('#18243f')};
const cT=new THREE.Color(),cB=new THREE.Color();
function updateSky(t){
  const h=hour();let a;if(h>=6&&h<=20)a=(h-6)/14*Math.PI;else{const hh=h<6?h+24:h;a=Math.PI+(hh-20)/10*Math.PI}
  const e=Math.sin(a);const dir=new THREE.Vector3(Math.cos(a)*.85,Math.max(e,-.3),-.45).normalize();
  const day=smooth(0,.22,e),dusk=smooth(-.14,.04,e);
  cT.copy(C.nTop).lerp(C.sTop,dusk).lerp(C.dTop,day);cB.copy(C.nBot).lerp(C.sBot,dusk).lerp(C.dBot,day);
  skyU.top.value.copy(cT);skyU.bot.value.copy(cB);skyU.sunDir.value.copy(e>-.05?dir:dir.clone().negate());skyU.glow.value=e>-.05?1:.15;
  skyU.sunCol.value.setRGB(1,lerp(.55,.92,day),lerp(.3,.8,day));
  scene.fog.color.copy(cB);renderer.setClearColor(cB);
  const lt=PL.R.g.position;const sd=e>0?dir:new THREE.Vector3(-dir.x,.7,-dir.z).normalize();
  sun.position.set(lt.x+sd.x*70,sd.y*70+lt.y,lt.z+sd.z*70);sun.target.position.copy(lt);
  if(e>0){sun.intensity=2.9*smooth(-.03,.15,e);sun.color.setRGB(1,lerp(.62,.95,day),lerp(.42,.85,day))}else{sun.intensity=.4*smooth(0,-.2,e);sun.color.setRGB(.6,.7,1)}
  hemi.intensity=lerp(.6,.95,dusk*.35+day*.65);hemi.color.setRGB(lerp(.5,.82,day),lerp(.6,.9,day),lerp(.95,1,day));
  stars.material.opacity=smooth(0,-.2,e);
  const wn=smooth(.15,-.05,e);for(const m of winMats)m.emissiveIntensity=wn*1.5;
  if(inside&&wn>0){hemi.intensity+=.55*wn;hemi.color.lerp(new THREE.Color(1,.78,.5),wn*.6)}
  const hb=BUILDINGS.find(b=>b.fire);if(hb)hb.fire.scale.y=.18+Math.sin(t*13)*.04;
  for(const c of clouds){c.material.color.setRGB(lerp(.25,1,dusk*.3+day*.7),lerp(.28,1,dusk*.2+day*.8),lerp(.4,1,day));c.position.x+=.4/60;if(c.position.x>340)c.position.x=-340}
  renderer.toneMappingExposure=lerp(1.25,1.05,day);
}

function mkCanine(o){
  const R=rig0('dog'),{body}=R;const bm=M(o.body,.9),dk=M(o.dark,.9),bl=M(o.belly||o.body,.9);const L=.42,by=L+.18;
  part(G.sph,bm,.4,.2,.19,0,by,0,body);part(G.sph,bm,.22,.23,.2,.24,by+.03,0,body);part(G.sph,bl,.3,.1,.14,.05,by-.12,0,body);
  part(G.neck,bm,.13,.25,.13,.38,by+.15,0,body,0,0,-.7);bake(body);
  const head=new THREE.Group();head.position.set(.5,by+.27,0);body.add(head);R.head=head;
  part(G.sph,bm,.15,.13,.13,0,0,0,head);part(G.sph,o.mask?dk:bm,.14,.075,.08,.15,-.04,0,head);part(G.sph,M('#111',.3),.035,.03,.035,.28,-.02,0,head);
  if(o.earsUp){part(G.cone,dk,.05,.13,.035,-.02,.15,.07,head,.25);part(G.cone,dk,.05,.13,.035,-.02,.15,-.07,head,-.25)}
  else{part(G.sph,dk,.04,.1,.06,-.02,.02,.12,head,.4);part(G.sph,dk,.04,.1,.06,-.02,.02,-.12,head,-.4)}
  eyes(head,.1,.05,.07,.018);bake(head);
  for(const [lx,lz] of[[.26,.11],[.26,-.11],[-.28,.11],[-.28,-.11]])R.legs.push(leg(body,lx,L,lz,.045,L,bm,dk));
  const tail=new THREE.Group();tail.position.set(-.38,by+.08,0);body.add(tail);
  if(o.tail==='curl')part(G.horn,bm,1.4,1.4,1.4,.02,.12,0,tail,0,0,1.2);else{part(G.cone,bm,.07,.45,.07,-.18,-.12,0,tail,0,0,2.2);if(o.tip)part(G.sph,M(o.tip,.9),.05,.06,.05,-.34,-.27,0,tail)}
  bake(tail);R.tail=tail;R.g.scale.setScalar(o.s||1);R.h=1;return R;
}
function animQuad(R,dt,spd,v){v.ph=(v.ph||0)+dt*spd*6;const sw=spd>.1?Math.sin(v.ph)*.6:0;R.legs[0].rotation.z=sw;R.legs[3].rotation.z=sw;R.legs[1].rotation.z=-sw;R.legs[2].rotation.z=-sw;

function npcKey(n){const h=hour();let key=n.sch[n.sch.length-1][1];for(const [hh,k] of n.sch)if(h>=hh)key=k;if(n.fair&&isFair()&&h>=10&&h<18)key=n.fair;return key}

function areaOf(x,z){return AREAS.find(A=>inB(A.B,x,z))}
function planNPC(n){
  const P=poiOf(n,n.key);const path=[];let sx=n.x,sz=n.z;
  const exA=areaOf(sx,sz);if(exA&&!(inB(exA.B,P.x,P.z))){for(const p of [...exA.via].reverse())path.push(p);[sx,sz]=path[path.length-1]}
  const enA=areaOf(P.x,P.z);const entry=enA&&!(exA===enA)?enA.via[0]:[P.x,P.z];
  if(Math.hypot(sx-entry[0],sz-entry[1])>18){const ni=(x,z)=>{let b=0,bd=1e9;CHAIN.forEach((c,i)=>{const d=Math.hypot(c[0]-x,c[1]-z);if(d<bd){bd=d;b=i}});return b};
    const i=ni(sx,sz),j=ni(entry[0],entry[1]);if(i!==j)for(let k=i;k!==j+(j>i?1:-1);k+=j>i?1:-1)path.push(CHAIN[k])}
  if(enA&&exA!==enA)for(const p of enA.via)path.push(p);

}

        n.stuck+=dt;if(n.stuck>2){if(d>n.lastD-.3){n.x=tx;n.z=tz;n.path.shift()}n.stuck=0;n.lastD=d}}
      if(!n.path.length)n.arrived=true}

function updateDog(dt,t){if(!S.dog||!DOG.R)return;const s=lerp(.5,1.08,clamp(S.dog.ag/(1.5*DAY),0,1));DOG.R.g.scale.setScalar(s);

    const moved=Math.hypot(nx-DOG.x,nz-DOG.z);DOG.stuck=moved<spd*dt*.3?DOG.stuck+dt:0;if(DOG.stuck>1.5){DOG.x=tx;DOG.z=tz;DOG.stuck=0}else{DOG.x=nx;DOG.z=nz}}
  else if(!chase)DOG.h=angLerp(DOG.h,Math.atan2(PL.z-DOG.z,PL.x-DOG.x),Math.min(1,dt*3));
  if(chase&&d<1.6)scare(pred,'dog');
  if(pred&&(DOG.bark-=dt)<0){DOG.bark=1.6;floatWorld(new THREE.Vector3(DOG.x,1.2,DOG.z),'Hav! Hav!')}

const PREDS=[];const FOX_FOOD=['tavuk','kaz'],WOLF_FOOD=['kuzu','oglak','koyun','keci'];
function predPen(k){if(k==='tilki')return S.animals.some(a=>penOf(a)==='kumes')?'kumes':null;return ['yayla','agil'].find(p=>S.animals.some(a=>penOf(a)===p&&WOLF_FOOD.includes(a.t)))||null}
function victim(k,pen){const L=S.animals.filter(a=>penOf(a)===pen&&(k==='tilki'?FOX_FOOD:WOLF_FOOD).includes(a.t));return L.length?pick(L):null}
function takeAnimal(a){killVis(a);S.animals=S.animals.filter(x=>x!==a);if(SEL===a.id)deselect();S.stats.lost++}
function predEvent(k){if(!READY)return;const pen=predPen(k);if(!pen)return;const nm=k==='tilki'?'tilkiyi':'kurdu';
  if(!LIVE||!READY){if(dogGuard()){S.news.push(`🐕 Gece ${S.dog.n} bir ${nm} kovaladı. Hayvanların güvende!`);S.dog.tr=Math.min(100,S.dog.tr+2)}
    else if(Math.random()<.4){const v=victim(k,pen);if(v){takeAnimal(v);S.news.push(`${k==='tilki'?'🦊':'🐺'} Gece ${k==='tilki'?'bir tilki':'bir kurt'} ${AT[v.t].e} ${v.n} adlı hayvanını kaçırdı! ${S.dog?'Kangalını eğit.':'Bir kangal edinmelisin.'}`)}}
    else S.news.push(`🌙 Gece ${PENS[pen].ad.toLocaleLowerCase('tr')} tarafından ${k==='tilki'?'tilki sesleri':'kurt ulumaları'} geldi ama bir şey olmadı.`);return}
  spawnPred(k,pen)}
function spawnPred(k,pen){const P=PENS[pen];const cx=pen==='yayla'?YC.x+20:0,cz=pen==='yayla'?YC.z:0;const a=Math.atan2(P.z-cz,P.x-cx)+rand(-.7,.7);const c=Math.cos(a),s=Math.sin(a);
  const sc=Math.min((P.w/2+1.3)/Math.max(.01,Math.abs(c)),(P.d/2+1.3)/Math.max(.01,Math.abs(s)));
  const R=GL_READY&&GLB[k==='tilki'?'fox':'wolf']?glAnimal(k==='tilki'?'fox':'wolf'):k==='tilki'?mkCanine({body:'#c8642a',dark:'#2a1a12',belly:'#f2ebe0',earsUp:1,tail:'bush',tip:'#f5f0e6',s:.75}):mkCanine({body:'#8d8780',dark:'#3a3633',belly:'#c9c3b8',earsUp:1,tail:'bush',s:1.12});
  const p={k,pen,R,x:P.x+c*(sc+40),z:P.z+s*(sc+40),tx:P.x+c*sc,tz:P.z+s*sc,h:a+Math.PI,st:'come',t:k==='tilki'?40:55,v:{}};scene.add(R.g);PREDS.push(p);
  toast(k==='tilki'?`🦊 ${P.ad} tarafında bir tilki dolaşıyor! Koş, kovala!`:`🐺 ${P.ad} yakınında kurt uluması! Sürünü koru!`)}
function scare(p,by){if(p.st==='flee')return;p.st='flee';const P=PENS[p.pen];p.h=Math.atan2(p.z-P.z,p.x-P.x);S.stats.chased++;
  if(by==='dog'){toast(`🐕 ${S.dog.n} ${p.k==='tilki'?'tilkiyi':'kurdu'} kovaladı! Aferin oğlum!`);S.dog.tr=Math.min(100,S.dog.tr+3);S.dog.bond=Math.min(100,(S.dog.bond||0)+5)}
  else toast(`💪 ${p.k==='tilki'?'Tilkiyi':'Kurdu'} kovaladın!`)}
function updatePreds(dt,t){for(let i=PREDS.length-1;i>=0;i--){const p=PREDS[i];let spd=0;
  if(!isNight()&&p.st!=='flee')scare(p,'gün');
  if(p.st==='come'){const dx=p.tx-p.x,dz=p.tz-p.z,d=Math.hypot(dx,dz);if(d<.5)p.st='lurk';else{spd=3.2;p.h=angLerp(p.h,Math.atan2(dz,dx),Math.min(1,dt*5))}}
  else if(p.st==='lurk'){p.t-=dt*(S.dog&&!dogGuard()?.5:1);const P=PENS[p.pen];p.h=angLerp(p.h,Math.atan2(P.z-p.z,P.x-p.x),dt*3);if(Math.sin(t*1.3+i)>.6){spd=1;p.h+=Math.sin(t)*.05}
    if(p.t<=0){const v=victim(p.k,p.pen);if(v){takeAnimal(v);toast(`${p.k==='tilki'?'🦊 Tilki':'🐺 Kurt'} ${AT[v.t].e} ${v.n} adlı hayvanını kaptı ve kaçtı!`)}p.st='flee';p.h=Math.atan2(p.z-P.z,p.x-P.x)}}
  else{spd=8;const P=PENS[p.pen];if(Math.hypot(p.x-P.x,p.z-P.z)>70){scene.remove(p.R.g);PREDS.splice(i,1);continue}}
  if(p.st!=='flee'&&Math.hypot(PL.x-p.x,PL.z-p.z)<2)scare(p,'player');
  p.x+=Math.cos(p.h)*spd*dt;p.z+=Math.sin(p.h)*spd*dt;p.R.g.position.set(p.x,getH(p.x,p.z),p.z);p.R.g.rotation.y=-p.h;if(p.R.gl)glAnim(p.R,dt,spd>5?'Gallop':spd>.1?'Walk':'Idle',spd>5?1.2:1);else{animQuad(p.R,dt,spd,p.v);p.R.tail.rotation.x=Math.sin(t*3)*.2}}}

    $('mgbtn').addEventListener('pointerdown',e=>{e.preventDefault();if(done||lock>0)return;const hit=p>=z0&&p<=z0+zw;if(hit)hits++;round++;$('mgt').textContent=(hit?'✅ Tam kıvamında!':'❌ Kaçırdın!')+` (${hits}/${round})`;lock=.6;

    const loop=()=>{if(done)return;const now=performance.now(),dt=(now-last)/1000;last=now;if(lock>0)lock-=dt;else{p+=dir*sp*dt;if(p>1){p=1;dir=-1}if(p<0){p=0;dir=1}}$('mgn').style.left=p*100+'%';requestAnimationFrame(loop)};requestAnimationFrame(loop)}

    $('mgc').addEventListener('pointerdown',e=>{const b=e.target.closest('.mgc');if(!b||done)return;e.preventDefault();const c=+b.dataset.c;

  const swap=(old,k,sc=1)=>{const R=glPerson(k);R.g.position.copy(old.g.position);R.g.rotation.copy(old.g.rotation);R.g.scale.setScalar(sc);scene.remove(old.g);scene.add(R.g);return R};
  PL.R=swap(PL.R,'farmer');for(const k in carryVis)PL.R.torso.add(carryVis[k]);
  for(const n of NP)if(GLB[NPCMODEL[n.id]])n.R=swap(n.R,NPCMODEL[n.id],n.kid?.68:1);
  {const p=NPC.g.position.clone(),r=NPC.g.rotation.y;scene.remove(NPC.g);Object.assign(NPC,glPerson('mworker'));NPC.g.position.copy(p);NPC.g.rotation.y=r;scene.add(NPC.g)}
  const fk=['mbusiness','madv','mcasual'];FAIRNPC.forEach((f,i)=>{f.R=swap(f.R,fk[i])});
  for(const h of humans)scene.remove(h.R.g);humans.length=0;syncHumans();
}
/* ================= döngü ================= */
let last=performance.now(),hudT=0,saveT=0,sepT=0,miniT=0,actT=0,fpsT=0,fpsN=0,slow=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;windU.value=t;
  sim(dt,true);
  updatePlayer(dt,t);
  const night=isNight();for(const a of S.animals)updateAnimalVis(a,dt,night);
  sepT+=dt;if(sepT>.05){sepT=0;separate()}
  updateHumans(dt,t);updateLife(dt,t);updateDecor(dt,t);flushField();
  for(const id of PEN_IDS){const o=penObj[id],p=S.pens[id],P=PENS[id];const fl=clamp(p.feed/P.feedCap,0,1),wl=clamp(p.water/P.waterCap,0,1);
    o.food.scale.y=Math.max(.001,.3*fl);o.food.position.y=.48+.15*fl;o.food.visible=fl>.01;o.water.scale.y=Math.max(.001,.3*wl);o.water.position.y=.36+.15*wl;o.water.visible=wl>.01;
    if(o.eggs){const n=Math.min(p.eggs,25),g=Math.min(p.geggs,5);let ni=0,gi=0;o.eggs.forEach((e,i)=>{if(i%6===5)e.visible=gi++<g;else e.visible=ni++<n})}}
  const ns=Math.min(24,Math.ceil(S.feed.tahil/25)),nb=Math.min(24,Math.ceil(S.feed.saman/40));ambarVis.sacks.forEach((s,i)=>s.visible=i<ns);ambarVis.bales.forEach((s,i)=>s.visible=i<nb);
  const sa=S.animals.find(a=>a.id===SEL);if(sa&&sa._v){ring.position.set(sa.x,.04,sa.z);ring.scale.setScalar(AT[sa.t].r*1.4);ring.material.opacity=.6+Math.sin(now/200)*.25}
  updateCamera(dt);updateSky(t);updateIcons();
  actT+=dt;if(actT>.1){actT=0;curAct=findAction()}updateActionUI();
  miniT+=dt;if(miniT>.1){miniT=0;drawMini(t)}
  hudT+=dt;if(hudT>.5){hudT=0;updateHUD();checkQuest();if(!pdown&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){if(UI.p)renderSheet();if(SEL)renderCard()}}
  saveT+=dt;if(saveT>5){saveT=0;save()}
  renderer.render(scene,camera);
  fpsT+=dt;fpsN++;if(fpsT>2){const fps=fpsN/fpsT;fpsT=0;fpsN=0;
    if(fps<40&&curPR>.75){curPR=Math.max(.75,curPR-.25);renderer.setPixelRatio(curPR);renderer.setSize(innerWidth,innerHeight)}
    else if(fps>57&&curPR<MAXPR){curPR=Math.min(MAXPR,curPR+.25);renderer.setPixelRatio(curPR);renderer.setSize(innerWidth,innerHeight)}
    if(fps<24&&curPR<=.75&&sun.castShadow){if(++slow>=2){sun.castShadow=false;toast('⚙️ Oyun akıcı olsun diye gölgeler kapatıldı.')}}else slow=0}
}

/* ================= başlat ================= */
for(const id of PEN_IDS)penObj[id].sign.visible=!S.pens[id].un;
for(const a of S.animals){const P=PENS[penOf(a)];if(Math.abs(a.x-P.x)>P.w/2||Math.abs(a.z-P.z)>P.d/2){const [x,z]=penRandPos(AT[a.t].pen);a.x=x;a.z=z}}
{const away=Math.min(1800,(Date.now()-(S.savedAt||Date.now()))/1000);
 if(away>20&&S.animals.length){const m0=S.money;let r=away;while(r>0){const st=Math.min(1,r);sim(st,false);r-=st}
   setTimeout(()=>toast(`⏳ Sen yokken çiftlik ${Math.round(away/60)} dakika çalıştı.${S.money!==m0?` Kasa: ${S.money>m0?'+':''}${tl(S.money-m0)}`:''}`),800)}}
initLife();spawnDecor();for(const a of S.animals)spawnVis(a);READY=true;playInit();loadGL();
syncHumans();drawMiniBg();updateHUD();checkQuest();
addEventListener('visibilitychange',()=>{if(document.hidden)save();else last=performance.now()});
addEventListener('pagehide',save);
window.__farmStarted=true;$('loading').remove();
if(!S.welcomed)welcome();else setTimeout(showNews,1500);
requestAnimationFrame(frame);
window.__farm={get info(){const i=renderer.info;let objs=0;scene.traverse(()=>objs++);return {calls:i.render.calls,tris:i.render.triangles,objs,geos:i.memory.geometries,pr:renderer.getPixelRatio()}},renderer,get S(){return S},AT,PENS,PL,cam,sim,buyAnimal,findAction,doAction,camera,keys,joy,openSheet};
