.chip.ic{margin-left:auto;padding:6px 9px}
#hQuest{display:inline-block;margin-top:6px;white-space:normal;max-width:100%;font-weight:600;font-size:13px;border-radius:14px}

#alerts{display:flex;flex-direction:column;gap:4px;margin-top:6px;align-items:flex-start}

.ic::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--panel)}
.ic.warn{background:#c0392b;color:#fff}.ic.warn::after{border-top-color:#c0392b}
.ic.name{font-size:12px;padding:2px 8px;font-weight:700;pointer-events:none}
.ft{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}

.x{width:34px;height:34px;border-radius:50%;background:var(--bar-bg);font-size:16px;font-weight:700}
.tabs{display:flex;gap:6px;padding:2px 16px 8px;overflow-x:auto}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= yardımcılar ================= */
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irand=n=>Math.floor(Math.random()*n);
const pick=a=>a[irand(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v)}
function fbm(x,y){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5}return s}
const tl=n=>Math.round(n).toLocaleString('tr-TR')+'₺';
const f1=n=>(Math.round(n*10)/10).toLocaleString('tr-TR');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= oyun verisi ================= */
const DAY=240; // bir oyun günü = 4 dakika
const PENS={
  kumes:{ad:'Kümes',e:'🐔',x:-22,z:-8,w:12,d:10,front:1,floor:'dirt',feed:'tahil',feedCap:30,waterCap:30,cap:[6,12,20],capCost:[0,1200,3500],unlock:0,autoCost:600,fl:2.6},
  agil:{ad:'Ağıl',e:'🐑',x:-2,z:-16,w:16,d:11,front:1,floor:'grass',feed:'saman',feedCap:80,waterCap:100,cap:[4,8,14],capCost:[0,3000,8000],unlock:1500,autoCost:1200,fl:3.6},
  ahir:{ad:'Ahır',e:'🐄',x:18,z:-12,w:16,d:14,front:1,floor:'dirt',feed:'saman',feedCap:200,waterCap:300,cap:[2,5,10],capCost:[0,8000,20000],unlock:6000,autoCost:2500,fl:5},
  padok:{ad:'At Padoku',e:'🐎',x:6,z:14,w:20,d:12,front:-1,floor:'grass',feed:'saman',feedCap:120,waterCap:200,cap:[2,4,6],capCost:[0,12000,30000],unlock:12000,autoCost:2500,fl:4},
};
const PEN_IDS=Object.keys(PENS);
const AT={
  tavuk:{ad:'Tavuk',e:'🐔',pen:'kumes',fiyat:120,ogun:.12,su:.25,urun:'yumurta',aralik:40,miktar:1,hiz:1.1,r:.25,
    bilgi:'Her ~40 sn\'de 1 yumurta'},
  kaz:{ad:'Kaz',e:'🪿',pen:'kumes',fiyat:350,ogun:.25,su:.4,urun:'kazYumurta',aralik:90,miktar:1,hiz:.9,r:.32,
    bilgi:'Her ~1,5 dk\'da 1 kaz yumurtası'},
  koyun:{ad:'Koyun',e:'🐑',pen:'agil',fiyat:1100,ogun:1.2,su:2,urun:'koyunSut',aralik:70,miktar:2,sagim:1,yun:{aralik:300,miktar:3},yavru:'kuzu',dogum:720,hiz:.8,r:.5,
    bilgi:'Süt verir, 5 dk\'da bir kırkılır, kuzu doğurur'},
  kuzu:{ad:'Kuzu',e:'🐑',pen:'agil',fiyat:450,ogun:.5,su:1,buyur:'koyun',buyume:480,hiz:1,r:.32,genc:1,
    bilgi:'8 dk\'da koyun olur'},
  keci:{ad:'Keçi',e:'🐐',pen:'agil',fiyat:950,ogun:1,su:2,urun:'keciSut',aralik:60,miktar:2.5,sagim:1,yavru:'oglak',dogum:600,hiz:.9,r:.45,
    bilgi:'Değerli keçi sütü verir, oğlak doğurur'},
  oglak:{ad:'Oğlak',e:'🐐',pen:'agil',fiyat:400,ogun:.5,su:1,buyur:'keci',buyume:420,hiz:1.1,r:.3,genc:1,
    bilgi:'7 dk\'da keçi olur'},
  inek:{ad:'İnek',e:'🐄',pen:'ahir',fiyat:3200,ogun:4,su:10,urun:'inekSut',aralik:75,miktar:12,sagim:1,yavru:'buzagi',dogum:960,hiz:.65,r:.95,
    bilgi:'Sağımda 12 L süt, buzağı doğurur'},
  buzagi:{ad:'Buzağı',e:'🐮',pen:'ahir',fiyat:1300,ogun:1.5,su:4,buyur:'inek',buyume:720,hiz:.9,r:.55,genc:1,
    bilgi:'12 dk\'da inek olur'},
  at:{ad:'At',e:'🐎',pen:'padok',fiyat:6000,ogun:3,su:8,gelir:{aralik:90,miktar:150},yavru:'tay',dogum:1200,hiz:1.3,r:.95,
    bilgi:'Binicilik turlarından 1,5 dk\'da bir 150₺, tay doğurur'},
  tay:{ad:'Tay',e:'🐴',pen:'padok',fiyat:2500,ogun:1.2,su:3,buyur:'at',buyume:900,hiz:1.4,r:.6,genc:1,
    bilgi:'15 dk\'da at olur'},
};
const SHOP=['tavuk','kaz','koyun','kuzu','keci','oglak','inek','buzagi','at','tay'];
const PR={
  yumurta:{ad:'Yumurta',b:'adet',f:7,e:'🥚'},kazYumurta:{ad:'Kaz Yumurtası',b:'adet',f:30,e:'🥚'},
  koyunSut:{ad:'Koyun Sütü',b:'L',f:14,e:'🥛'},keciSut:{ad:'Keçi Sütü',b:'L',f:16,e:'🥛'},
  inekSut:{ad:'İnek Sütü',b:'L',f:11,e:'🥛'},yun:{ad:'Yün',b:'kg',f:50,e:'🧶'}};
const FEED={
  tahil:{ad:'Tahıl Yemi',e:'🌾',kim:'Tavuk ve kaz',paket:[[25,90,'Çuval'],[250,850,'10 çuval']],cap:1000},
  saman:{ad:'Saman & Ot',e:'🌿',kim:'Koyun, keçi, inek, at',paket:[[20,70,'Balya'],[200,650,'10 balya'],[1000,3000,'50 balya']],cap:4000}};
const WK={
  bakici:{ad:'Bakıcı',e:'🧑‍🌾',is:'Yemlikleri depodan doldurur, suyu tazeler',ucret:500,maas:80,max:3,shirt:'#3a6ea5'},
  sagimci:{ad:'Sağımcı',e:'👩‍🌾',is:'Hayvanları sağar, yumurta toplar, yün kırkar',ucret:800,maas:120,max:3,shirt:'#b04a3a'},
  pazarci:{ad:'Pazarcı',e:'🧔',is:'Her akşam 18:00\'de depodaki ürünleri satar (%5 komisyon)',ucret:600,maas:60,max:1,shirt:'#6b8e23'},
  veteriner:{ad:'Veteriner',e:'🧑‍⚕️',is:'Hasta hayvanları ücretsiz iyileştirir',ucret:1500,maas:150,max:1,shirt:'#f0f0f0'}};
const DEPO=[150,400,1000,2500],DEPO_COST=[0,1500,5000,15000];
const VET_COST=250,SAGIM_MAK=6000;
const NAMES=['Sarıkız','Benekli','Pamuk','Karabaş','Duman','Minnoş','Boncuk','Zeytin','Fındık','Papatya','Menekşe','Yıldız','Tarçın','Kınalı','Gümüş','Rüzgar','Şimşek','Lale','Nergis','Karamel','Bulut','Kömür','Ceylan','Maviş','Cimcime','Pırıl','Tosun','Sultan','Kartopu','Elma','Badem','Fıstık','Çakıl','Mısır','Kestane','Gelincik','Sümbül','Paşa','Efe','Nazlı','Çiçek','Limon','Haylaz','Paytak','Ayva','Hünkar','Dolunay','Safran'];

/* ================= kayıt ================= */
const KEY='bereket_ciftligi_v1';
function newState(){
  const s={v:1,money:600,t:.33,day:1,feed:{tahil:25,saman:0},prod:{},pm:{},pens:{},animals:[],nid:1,
    wk:{bakici:0,sagimci:0,pazarci:0,veteriner:0},depo:0,sagimMak:0,q:0,
    stats:{eggs:0,milk:0,wool:0,sold:0,milkings:0,born:0,fed:0},savedAt:Date.now(),welcomed:0,quality:1};
  for(const k in PR){s.prod[k]=0;s.pm[k]=1}
  for(const id of PEN_IDS)s.pens[id]={un:id==='kumes'?1:0,lvl:0,feed:0,water:PENS[id].waterCap,eggs:0,geggs:0,auto:0};
  return s;
}
function load(){
  const d=newState();
  try{const raw=localStorage.getItem(KEY);if(!raw)return d;const s=JSON.parse(raw);
    const m=Object.assign(d,s);m.feed=Object.assign(newState().feed,s.feed);m.prod=Object.assign(newState().prod,s.prod);
    m.pm=Object.assign(newState().pm,s.pm);m.wk=Object.assign(newState().wk,s.wk);m.stats=Object.assign(newState().stats,s.stats);
    for(const id of PEN_IDS)m.pens[id]=Object.assign(newState().pens[id],(s.pens||{})[id]);
    m.animals=(s.animals||[]).filter(a=>AT[a.t]);return m;
  }catch(e){return d}
}
let S=load();
function save(){
  S.savedAt=Date.now();
  const o=Object.assign({},S,{animals:S.animals.map(a=>{const c=Object.assign({},a);delete c._v;return c})});
  try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}
}

/* ================= three kurulumu ================= */
const HQ=S.quality!==0;
const renderer=new THREE.WebGLRenderer({antialias:HQ,powerPreference:'high-performance'});
renderer.domElement.id='gl';
renderer.setPixelRatio(Math.min(devicePixelRatio||1,HQ?2:1));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=HQ;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.3,900);
camera.position.set(4,34,40);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,-3);controls.enableDamping=true;controls.dampingFactor=.08;
controls.maxPolarAngle=1.36;controls.minPolarAngle=.25;controls.minDistance=5;controls.maxDistance=90;
controls.screenSpacePanning=false;controls.rotateSpeed=.6;controls.zoomSpeed=1.1;controls.panSpeed=1.1;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const hemi=new THREE.HemisphereLight(0xcfe6ff,0x4b5a2a,.6);scene.add(hemi);

function updateAnimalVis(a,dt,night){
  const v=a._v;if(!v)return;const d=AT[a.t],R=v.R,P=PENS[d.pen];
  let moving=false;
  if(v.eat>0){v.eat-=dt}
  else if(v.wait>0){v.wait-=dt;if(v.wait<=0&&!v.goal){if(Math.random()<(night?.25:.75)){const [x,z]=penRandPos(d.pen);v.tx=x;v.tz=z}else v.wait=rand(2,6);if(R.kind!=='chicken'&&R.kind!=='goose'&&Math.random()<.4)v.graze=rand(2,5)}}
  else{
    const dx=v.tx-a.x,dz=v.tz-a.z,dist=Math.hypot(dx,dz);
    if(dist<.25){
      if(v.goal==='feed'){eat(a);v.eat=rand(3,5)}else if(v.goal==='water'){drink(a);v.eat=rand(2,3)}
      v.goal=null;v.wait=rand(1.5,7)*(night?2:1);
    }else{
      const want=Math.atan2(dz,dx);let df=want-v.h;df=Math.atan2(Math.sin(df),Math.cos(df));v.h+=df*Math.min(1,dt*4);
      const sp=d.hiz*(night?.5:1)*(Math.abs(df)>1?.3:1)*(v.goal?1.3:1);
      a.x+=Math.cos(v.h)*sp*dt;a.z+=Math.sin(v.h)*sp*dt;moving=true;
    }
  }
  a.x=clamp(a.x,P.x-P.w/2+.5,P.x+P.w/2-.5);a.z=clamp(a.z,P.z-P.d/2+.5,P.z+P.d/2-.5);
  R.g.position.set(a.x,0,a.z);R.g.rotation.y=-v.h;
  v.ph+=dt*(moving?d.hiz*7*(R.kind==='chicken'?1.8:1):0);
  const sw=moving?Math.sin(v.ph)*.55:0;
  if(R.legs.length===4){R.legs[0].rotation.z=sw;R.legs[3].rotation.z=sw;R.legs[1].rotation.z=-sw;R.legs[2].rotation.z=-sw}
  else if(R.legs.length===2){R.legs[0].rotation.z=sw;R.legs[1].rotation.z=-sw}
  R.body.position.y=moving?Math.abs(Math.cos(v.ph))*.03:0;
  // kafa: yeme / otlama / gagalama
  let hr=0;const t=performance.now()/1000;
  if(v.eat>0||v.graze>0){if(v.graze>0)v.graze-=dt;hr=(R.kind==='chicken'||R.kind==='goose')?-.7-Math.abs(Math.sin(t*9))*.5:-.85+Math.sin(t*3)*.08}
  else if((R.kind==='chicken')&&!moving)hr=Math.sin(t*2+a.id)*.15+(Math.sin(t*.7+a.id*3)>.7?-.9:0);
  else hr=Math.sin(t*.8+a.id)*.08;
  R.head.rotation.z=lerp(R.head.rotation.z,hr,Math.min(1,dt*8));
  if(R.tail)R.tail.rotation.x=Math.sin(t*2.2+a.id)*.35;
  if(R.wool&&d.yun){const s=a.wr?1:.72+.28*clamp(a.wp/d.yun.aralik,0,1);R.wool.scale.set(1,s*.9+.1,s)}
  if(a.sick)R.g.rotation.z=0;
}
function goTo(a,goal){const v=a._v,o=penObj[AT[a.t].pen],P=PENS[AT[a.t].pen],src=goal==='feed'?o.fpos:o.wpos;const L=P.fl*.42;
  v.goal=goal;v.tx=src.x+rand(-L,L);v.tz=src.z-P.front*(.55+AT[a.t].r*.9);v.wait=0;v.eat=0;v.graze=0}
function separate(){
  const by={};for(const a of S.animals){if(!a._v)continue;(by[AT[a.t].pen]||(by[AT[a.t].pen]=[])).push(a)}
  for(const k in by){const L=by[k];for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const A=L[i],B=L[j],dx=B.x-A.x,dz=B.z-A.z,d=Math.hypot(dx,dz),m=AT[A.t].r+AT[B.t].r;if(d<m&&d>1e-4){const p=(m-d)/d*.25;A.x-=dx*p;A.z-=dz*p;B.x+=dx*p;B.z+=dz*p}}}
}

const humans=[];
function poiList(){const L=[[-21,13],[0,0],[31,-16]];for(const id of PEN_IDS){if(!S.pens[id].un)continue;const P=PENS[id];const fz=P.z+P.front*(P.d/2+1.2);L.push([P.x-P.w*.27,fz],[P.x+P.w*.27,fz],[P.x,fz])}return L}
function syncHumans(){
  const want=[];for(const k in WK)for(let i=0;i<S.wk[k];i++)want.push(k);
  while(humans.length>want.length){const h=humans.pop();scene.remove(h.R.g)}
  for(let i=0;i<want.length;i++){if(humans[i]&&humans[i].k===want[i])continue;if(humans[i])scene.remove(humans[i].R.g);
    const R=mkHuman(WK[want[i]].shirt);const [x,z]=pick(poiList());R.g.position.set(x+rand(-1,1),0,z+rand(-1,1));scene.add(R.g);humans[i]={k:want[i],R,x:R.g.position.x,z:R.g.position.z,tx:x,tz:z,h:0,wait:rand(2),ph:0}}
}
function updateHumans(dt){for(const H of humans){let mv=false;if(H.wait>0){H.wait-=dt;if(H.wait<=0){const [x,z]=pick(poiList());H.tx=x+rand(-1,1);H.tz=z+rand(-.5,.5)}}else{const dx=H.tx-H.x,dz=H.tz-H.z,d=Math.hypot(dx,dz);if(d<.2)H.wait=rand(2,6);else{const w=Math.atan2(dz,dx);let df=w-H.h;df=Math.atan2(Math.sin(df),Math.cos(df));H.h+=df*Math.min(1,dt*5);H.x+=Math.cos(H.h)*1.5*dt;H.z+=Math.sin(H.h)*1.5*dt;mv=true}}
  H.R.g.position.set(H.x,getH(H.x,H.z),H.z);H.R.g.rotation.y=-H.h;H.ph+=mv?dt*9:0;const s=mv?Math.sin(H.ph)*.6:0;H.R.legs[0].rotation.z=s;H.R.legs[1].rotation.z=-s;H.R.arms[0].rotation.z=-s*.8;H.R.arms[1].rotation.z=s*.8}}

/* ================= simülasyon ================= */
const cnt=t=>S.animals.filter(a=>a.t===t).length;
const penCount=pid=>S.animals.filter(a=>AT[a.t].pen===pid).length;
const penCap=pid=>PENS[pid].cap[S.pens[pid].lvl];
const depoCap=()=>DEPO[S.depo];
const depoUsed=()=>{let s=0;for(const k in S.prod)s+=S.prod[k];return s};
const hour=()=>S.t*24;
const isNight=()=>{const h=hour();return h<5.5||h>=20.5};
function addProd(k,n){const room=depoCap()-depoUsed();const add=Math.min(n,Math.max(0,room));if(add<=0)return 0;S.prod[k]=Math.round((S.prod[k]+add)*10)/10;return add}
function eat(a){const d=AT[a.t],p=S.pens[d.pen];if(p.feed>=d.ogun){p.feed-=d.ogun;a.hu=Math.min(100,a.hu+50)}}
function drink(a){const d=AT[a.t],p=S.pens[d.pen];if(p.water>=d.su){p.water-=d.su;a.th=Math.min(100,a.th+55)}}
const wt={b:0,s:0,v:0};let LIVE=false;
function sim(dt,live){
  LIVE=live;const prevT=S.t;S.t+=dt/DAY;
  if(prevT<.75&&S.t>=.75&&S.wk.pazarci)sellAll(.05,true);
  if(S.t>=1){S.t-=1;newDay()}
  const k=isNight()?.5:1;
  for(const id of PEN_IDS){const p=S.pens[id];if(p.un&&p.auto)p.water=PENS[id].waterCap}
  for(const a of [...S.animals]){
    const d=AT[a.t],p=S.pens[d.pen];
    a.hu=Math.max(0,a.hu-.4*k*dt);a.th=Math.max(0,a.th-.5*k*dt);a.ag+=dt;
    const busy=live&&a._v&&a._v.goal;
    if(!busy){
      if(a.hu<60&&p.feed>=d.ogun){if(live&&a._v)goTo(a,'feed');else eat(a)}
      else if(a.th<60&&p.water>=d.su){if(live&&a._v)goTo(a,'water');else drink(a)}
    }
    if(a.hu<=0||a.th<=0)a.hp-=.08*dt;else if(!a.sick)a.hp=Math.min(100,a.hp+.04*dt);
    a.hp=Math.max(0,a.hp);
    if(a.hp<30&&!a.sick){a.sick=1;if(live)toast(`🤒 ${a.n} (${d.ad}) hastalandı! Veteriner gerekiyor.`)}
    const ok=!a.sick&&a.hu>25&&a.th>25,mood=(a.hu+a.th+a.hp)/300,rate=dt*(.5+mood*.7);
    if(d.buyur&&a.ag>=d.buyume){grow(a,live);continue}
    if(ok&&d.urun&&!a.rd){a.pr+=rate;if(a.pr>=d.aralik){a.pr=0;
      if(a.t==='tavuk'){if(p.eggs+p.geggs<60)p.eggs++}else if(a.t==='kaz'){if(p.eggs+p.geggs<60)p.geggs++}else a.rd=1}}
    if(ok&&d.yun&&!a.wr){a.wp+=rate;if(a.wp>=d.yun.aralik)a.wr=1}
    if(ok&&d.gelir){a.pr+=rate;if(a.pr>=d.gelir.aralik){a.pr=0;S.money+=d.gelir.miktar;if(live)floatAt(a,'+'+tl(d.gelir.miktar)+' 🏇')}}
    if(ok&&d.yavru&&a.hp>60&&a.hu>40){a.br+=rate;if(a.br>=d.dogum){if(penCount(d.pen)<penCap(d.pen)){a.br=0;birth(a,live)}else{a.br=d.dogum;if(live&&!a.fullWarn){a.fullWarn=1;toast(`🍼 ${a.n} doğuruma hazır ama ${PENS[d.pen].ad} dolu. Bölmeyi genişlet!`)}}}}
  }
  workerSim(dt,live);
}
function workerSim(dt,live){
  const W=S.wk;
  if(W.bakici){wt.b+=dt;const iv=4/W.bakici;while(wt.b>=iv){wt.b-=iv;bakiciJob()}}else wt.b=0;
  if(W.sagimci){wt.s+=dt;const iv=2.5/W.sagimci;while(wt.s>=iv){wt.s-=iv;sagimciJob()}}else wt.s=0;
  if(W.veteriner){wt.v+=dt;if(wt.v>=5){wt.v=0;const a=S.animals.find(a=>a.sick);if(a)heal(a,0)}}
}
let feedWarnDay=0;
function bakiciJob(){
  for(const id of PEN_IDS){const p=S.pens[id],P=PENS[id];if(!p.un)continue;
    if(p.water<P.waterCap*.5){fillWater(id,true);return}
    if(p.feed<P.feedCap*.5&&penCount(id)){if(S.feed[P.feed]>0){fillFeed(id,true);return}else if(feedWarnDay!==S.day&&LIVE){feedWarnDay=S.day;toast(`🧑‍🌾 Bakıcı: "Depoda ${FEED[P.feed].ad.toLowerCase()} kalmadı patron!"`)}}}
}
function sagimciJob(){
  for(const id of PEN_IDS){const p=S.pens[id];if(p.eggs+p.geggs>0&&depoUsed()<depoCap()){collectEggs(id,true);return}}
  const a=S.animals.find(a=>a.rd&&!a.sick)||S.animals.find(a=>a.wr);
  if(a&&depoUsed()<depoCap()){if(a.rd)milk(a,true);else shear(a,true)}
}
function newDay(){
  S.day++;let wages=0;for(const k in WK)wages+=WK[k].maas*S.wk[k];
  const quit=[];
  while(wages>0&&S.money<wages){const ks=Object.keys(WK).filter(k=>S.wk[k]>0).sort((a,b)=>WK[b].maas-WK[a].maas);if(!ks.length)break;S.wk[ks[0]]--;wages-=WK[ks[0]].maas;quit.push(WK[ks[0]].ad)}
  S.money-=wages;
  for(const k in PR)S.pm[k]=clamp(S.pm[k]*rand(.86,1.16)*(1+(1-S.pm[k])*.3),.7,1.4);
  if(LIVE){toast(`🌅 Gün ${S.day} başladı${wages?` · Maaşlar: -${tl(wages)}`:''}`);if(quit.length)toast(`😞 Maaş ödenemedi: ${quit.join(', ')} işi bıraktı.`);syncHumans()}
}
function grow(a,live){const d=AT[a.t];const old=d.ad;a.t=d.buyur;a.pr=rand(AT[a.t].aralik||10)*.3;a.br=0;a.rd=0;a.wr=0;a.wp=0;
  if(live&&a._v){const x=a.x,z=a.z;killVis(a);spawnVis(a);toast(`🎉 ${old} ${a.n} büyüdü, artık bir ${AT[a.t].ad.toLowerCase()}!`);if(SEL===a.id)renderCard()}}
function newAnimal(t,x,z){const d=AT[t];return {id:S.nid++,t,n:pick(NAMES),c:irand(20),x,z,hu:85,th:85,hp:100,pr:rand(0,(d.aralik||d.gelir?.aralik||10)*.5),rd:0,wp:0,wr:0,ag:d.genc?0:DAY*rand(3,8),br:rand(0,(d.dogum||1)*.3),sick:0}}
function birth(par,live){const d=AT[par.t];const b=newAnimal(d.yavru,par.x+rand(-.6,.6),par.z+rand(-.6,.6));b.ag=0;b.hu=100;b.th=100;b.br=0;S.animals.push(b);S.stats.born++;
  if(live){spawnVis(b);toast(`🍼 ${par.n} bir ${AT[b.t].ad.toLowerCase()} doğurdu! Adı: ${b.n}`);floatAt(b,'🎉')}}

function canPay(n){if(S.money>=n)return true;toast('💸 Paran yetmiyor!');return false}
function buyAnimal(t){const d=AT[t],pid=d.pen;if(!S.pens[pid].un)return toast(`🔒 Önce ${PENS[pid].ad} açılmalı.`);if(penCount(pid)>=penCap(pid))return toast(`${PENS[pid].ad} dolu! Geliştir menüsünden genişlet.`);if(!canPay(d.fiyat))return;
  S.money-=d.fiyat;const [x,z]=penRandPos(pid);const a=newAnimal(t,x,z);S.animals.push(a);spawnVis(a);toast(`${d.e} ${a.n} adında bir ${d.ad.toLowerCase()} aldın!`);
  closeSheet();focusPen(pid);selectAnimal(a.id);refresh()}
function buyFeed(k,i){const [kg,pr]=FEED[k].paket[i];if(S.feed[k]+kg>FEED[k].cap)return toast(`Yem ambarı dolu (en fazla ${FEED[k].cap} kg).`);if(!canPay(pr))return;S.money-=pr;S.feed[k]+=kg;toast(`${FEED[k].e} ${kg} kg ${FEED[k].ad.toLowerCase()} alındı.`);refresh()}
function fillFeed(pid,silent){const P=PENS[pid],p=S.pens[pid];const need=P.feedCap-p.feed;if(need<.05){if(!silent)toast('Yemlik zaten dolu.');return}const take=Math.min(need,S.feed[P.feed]);if(take<=0){if(!silent)toast(`Depoda ${FEED[P.feed].ad.toLowerCase()} yok! Pazardan al.`);return}
  S.feed[P.feed]=Math.round((S.feed[P.feed]-take)*100)/100;p.feed+=take;S.stats.fed++;if(!silent){toast(`${FEED[P.feed].e} ${PENS[pid].ad} yemliğine ${f1(take)} kg yem kondu.`);refresh()}}
function fillWater(pid,silent){const P=PENS[pid],p=S.pens[pid];if(P.waterCap-p.water<.05){if(!silent)toast('Suluk zaten dolu.');return}p.water=P.waterCap;if(!silent){toast(`💧 ${P.ad} suluğu dolduruldu.`);refresh()}}
function collectEggs(pid,silent){const p=S.pens[pid];if(p.eggs+p.geggs<=0)return;let a=addProd('yumurta',p.eggs);p.eggs-=a;let b=addProd('kazYumurta',p.geggs);p.geggs-=b;S.stats.eggs+=a+b;
  if(!silent){if(a+b<=0)return toast('📦 Depo dolu! Ürün sat ya da depoyu büyüt.');toast(`🥚 ${a+b} yumurta toplandı.`);floatWorld(penObj[pid].nest.position,`+${a+b} 🥚`);refresh()}}
function milk(a,silent){if(!a.rd)return;const d=AT[a.t];const amt=d.miktar*(S.sagimMak?1.3:1);const got=addProd(d.urun,amt);if(got<=0){if(!silent)toast('📦 Depo dolu! Ürün sat ya da depoyu büyüt.');return}
  a.rd=0;S.stats.milk+=got;S.stats.milkings++;if(LIVE)floatAt(a,`+${f1(got)} L 🥛`);if(!silent)refresh()}
function shear(a,silent){if(!a.wr)return;const got=addProd('yun',AT[a.t].yun.miktar);if(got<=0){if(!silent)toast('📦 Depo dolu!');return}a.wr=0;a.wp=0;S.stats.wool+=got;if(LIVE)floatAt(a,`+${f1(got)} kg 🧶`);if(!silent)refresh()}
function heal(a,cost){if(!a.sick)return;if(cost&&!canPay(cost))return;S.money-=cost;a.sick=0;a.hp=80;a.hu=Math.max(a.hu,40);a.th=Math.max(a.th,40);if(LIVE){toast(`🧑‍⚕️ ${a.n} iyileşti!`);floatAt(a,'💚')}refresh()}

function sellAnimal(a){const v=animalValue(a);S.money+=v;killVis(a);S.animals=S.animals.filter(x=>x!==a);toast(`${AT[a.t].e} ${a.n} ${tl(v)}'ye satıldı.`);deselect();refresh()}

function sell(k,fee=0){const n=S.prod[k];if(n<=0)return 0;const m=n*price(k)*(1-fee);S.money+=m;S.stats.sold+=m;S.prod[k]=0;return m}

let tween=null;
function camTo(tx,tz,dist,dir){const from={t:controls.target.clone(),c:camera.position.clone()};const t=new THREE.Vector3(tx,0,tz);
  const off=dir?dir.clone():camera.position.clone().sub(controls.target).normalize();if(dir===undefined){}off.normalize().multiplyScalar(dist);tween={from,to:{t,c:t.clone().add(off)},k:0}}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};tween=null});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;const tap=Math.hypot(dx,dy)<9&&performance.now()-down.t<450;down=null;if(!tap)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const targets=[...pickables];for(const id of PEN_IDS){const o=penObj[id];targets.push(o.feeder,o.trough,o.sign);if(o.nest)targets.push(o.nest)}
  const hit=ray.intersectObjects(targets,true)[0];
  if(hit){let o=hit.object;while(o&&o.userData.aid===undefined&&o.userData.pen===undefined)o=o.parent;
    if(o&&o.userData.aid!==undefined){selectAnimal(o.userData.aid);return}
    if(o&&o.userData.pen){const id=o.userData.pen;if(!S.pens[id].un){openSheet('up');return}if(o===penObj[id].nest&&S.pens[id].eggs+S.pens[id].geggs>0){collectEggs(id);return}selectPen(id);return}}
  if(SEL||SELPEN)deselect();if(UI.p)closeSheet()});

function updateIcons(){
  const camD=camera.position.distanceTo(controls.target);
  for(const a of S.animals){const v=a._v;if(!v)continue;const ic=camD<75?animalIcon(a):null;const sel=a.id===SEL;
    const key=ic?ic.join():sel?'sel':'';

      if(ic)v.ic=iconEl(ic[0],ic[1],'icon',{id:a.id});else if(sel)v.ic=iconEl(esc(a.n),'name','none',{})}
    if(v.ic){tmpV.set(a.x,v.R.h*(AT[a.t].genc?.6:1)+.25,a.z);project(tmpV.clone(),v.ic)}}
  for(const id of PEN_IDS){const p=S.pens[id],o=penObj[id],P=PENS[id];const L=penIcons[id]||(penIcons[id]={});
    const show=(k,cond,html,pos,cls)=>{if(cond){if(!L[k]||L[k].dataset.h!==html){if(L[k])L[k].remove();L[k]=iconEl(html,cls,'penicon',{id,w:k,h:html})}project(pos,L[k])}else if(L[k]){L[k].remove();L[k]=null}};
    const has=p.un&&penCount(id)>0;
    show('eggs',p.un&&p.eggs+p.geggs>0,`🥚 ${p.eggs+p.geggs}`,o.nest?o.nest.position.clone().setY(.9):o.fpos,'');
    const fe=S.animals.find(a=>AT[a.t].pen===id);
    show('feed',has&&fe&&p.feed<AT[fe.t].ogun*2,'🌾 Yem koy',o.fpos.clone().setY(1.5),'warn');
    show('water',has&&!p.auto&&p.water<P.waterCap*.15,'💧 Su koy',o.wpos.clone().setY(1.5),'warn');}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=1/60;const p=f.p.clone();p.y+=f.t*1.2;project(p,f.el);f.el.style.opacity=String(clamp(1.6-f.t*1.3,0,1));if(f.t>1.3){f.el.remove();floats.splice(i,1)}}
}

/* ================= gün / gece ================= */
const C={dTop:new THREE.Color('#3f80cf'),dBot:new THREE.Color('#cfe4f1'),sTop:new THREE.Color('#41558a'),sBot:new THREE.Color('#f2a66b'),nTop:new THREE.Color('#050916'),nBot:new THREE.Color('#141f38')};
const cT=new THREE.Color(),cB=new THREE.Color();
function updateSky(){
  const h=hour();let a;if(h>=6&&h<=20)a=(h-6)/14*Math.PI;else{const hh=h<6?h+24:h;a=Math.PI+(hh-20)/10*Math.PI}
  const e=Math.sin(a);const dir=new THREE.Vector3(Math.cos(a)*.85,Math.max(e,-.3),-.45).normalize();
  const day=smooth(0,.22,e),dusk=smooth(-.14,.04,e);
  cT.copy(C.nTop).lerp(C.sTop,dusk).lerp(C.dTop,day);cB.copy(C.nBot).lerp(C.sBot,dusk).lerp(C.dBot,day);
  skyU.top.value.copy(cT);skyU.bot.value.copy(cB);skyU.sunDir.value.copy(e>-.05?dir:dir.clone().negate());skyU.glow.value=e>-.05?1:.15;
  skyU.sunCol.value.setRGB(1,lerp(.55,.92,day),lerp(.3,.8,day));
  scene.fog.color.copy(cB);renderer.setClearColor(cB);
  const lt=controls.target;sun.position.set(lt.x+dir.x*90,Math.max(dir.y,.08)*90,lt.z+dir.z*90);sun.target.position.copy(lt);
  sun.intensity=2.9*smooth(-.03,.15,e);sun.color.setRGB(1,lerp(.62,.95,day),lerp(.42,.85,day));
  if(e<0){sun.position.set(lt.x-dir.x*90,60,lt.z-dir.z*90);sun.intensity=.35*smooth(.0,-.25,e);sun.color.setRGB(.6,.7,1)}
  hemi.intensity=lerp(.6,.95,dusk*.35+day*.65);hemi.color.setRGB(lerp(.5,.82,day),lerp(.6,.9,day),lerp(.95,1,day));
  stars.material.opacity=smooth(.0,-.2,e);
  const wn=smooth(.15,-.05,e);for(const m of winMats)m.emissiveIntensity=wn*1.4;
  renderer.toneMappingExposure=lerp(1.25,1.05,day);
}

/* ================= döngü ================= */
let last=performance.now(),acc=0,hudT=0,saveT=0,sepT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-last)/1000);last=now;
  sim(dt,true);
  const night=isNight();for(const a of S.animals)updateAnimalVis(a,dt,night);
  sepT+=dt;if(sepT>.1){sepT=0;separate()}
  updateHumans(dt);
  // yemlik / su görsel seviyeleri
  for(const id of PEN_IDS){const o=penObj[id],p=S.pens[id],P=PENS[id];const fl=clamp(p.feed/P.feedCap,0,1),wl=clamp(p.water/P.waterCap,0,1);
    o.food.scale.y=Math.max(.001,.3*fl);o.food.position.y=.48+.15*fl;o.food.visible=fl>.01;o.water.scale.y=Math.max(.001,.3*wl);o.water.position.y=.36+.15*wl;o.water.visible=wl>.01;
    if(o.eggs){const n=Math.min(p.eggs,25),g=Math.min(p.geggs,5);o.eggs.forEach((e,i)=>{e.visible=i%7===6?(Math.floor(i/7)<g):(i-Math.floor(i/7)<n)})}}
  const sa=S.animals.find(a=>a.id===SEL);if(sa&&sa._v){ring.position.set(sa.x,.04,sa.z);const r=AT[sa.t].r*1.4;ring.scale.setScalar(r);ring.material.opacity=.6+Math.sin(now/200)*.25}
  if(tween){tween.k=Math.min(1,tween.k+dt*1.8);const k=1-Math.pow(1-tween.k,3);controls.target.lerpVectors(tween.from.t,tween.to.t,k);camera.position.lerpVectors(tween.from.c,tween.to.c,k);if(tween.k>=1)tween=null}
  controls.update();const tg=controls.target;tg.y=0;const L=Math.hypot(tg.x,tg.z);if(L>45){tg.x*=45/L;tg.z*=45/L}
  if(camera.position.y<getH(camera.position.x,camera.position.z)+2)camera.position.y=getH(camera.position.x,camera.position.z)+2;
  updateSky();updateIcons();
  hudT+=dt;if(hudT>.5){hudT=0;updateHUD();checkQuest();if(!pdown){if(UI.p)renderSheet();if(SEL||SELPEN)renderCard()}}
  saveT+=dt;if(saveT>5){saveT=0;save()}
  renderer.render(scene,camera);
}

/* ================= başlat ================= */
for(const id of PEN_IDS)penObj[id].sign.visible=!S.pens[id].un;
{const away=Math.min(1800,(Date.now()-(S.savedAt||Date.now()))/1000);
 if(away>20&&S.animals.length){const m0=S.money,e0=S.stats.eggs;let r=away;while(r>0){const st=Math.min(1,r);sim(st,false);r-=st}
   setTimeout(()=>toast(`⏳ Sen yokken çiftlik ${Math.round(away/60)} dakika çalıştı.${S.money!==m0?` Kasa: ${S.money>m0?'+':''}${tl(S.money-m0)}`:''}`),800)}}
for(const a of S.animals)spawnVis(a);
syncHumans();updateHUD();checkQuest();
addEventListener('visibilitychange',()=>{if(document.hidden)save();else last=performance.now()});
addEventListener('pagehide',save);
window.__farmStarted=true;$('loading').remove();
if(!S.welcomed)welcome();
requestAnimationFrame(frame);
window.__farm={S,AT,PENS,sim,buyAnimal,focusPen,camera,controls};
</script>
