function collide(px,pz,r,list){
  for(const c of list){if(px<c.x0-r||px>c.x1+r||pz<c.z0-r||pz>c.z1+r)continue;
    const cx=clamp(px,c.x0,c.x1),cz=clamp(pz,c.z0,c.z1);const dx=px-cx,dz=pz-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2>1e-8){const d=Math.sqrt(d2);px=cx+dx/d*r;pz=cz+dz/d*r}else{const l=px-c.x0,rr=c.x1-px,t=pz-c.z0,b=c.z1-pz,m=Math.min(l,rr,t,b);if(m===l)px=c.x0-r;else if(m===rr)px=c.x1+r;else if(m===t)pz=c.z0-r;else pz=c.z1+r}}}
  return [px,pz];
}
function segHit(ax,ay,az,bx,by,bz,skip){
  let tmin=1;const d=[bx-ax,by-ay,bz-az],o=[ax,ay,az];
  for(const c of COL){if(c.h<1.3||c===skip)continue;const lo=[c.x0-.2,-1,c.z0-.2],hi=[c.x1+.2,c.h+.25,c.z1+.2];let t0=0,t1=1,ok=true;
    for(let k=0;k<3;k++){if(Math.abs(d[k])<1e-9){if(o[k]<lo[k]||o[k]>hi[k]){ok=false;break}}else{let ta=(lo[k]-o[k])/d[k],tb=(hi[k]-o[k])/d[k];if(ta>tb){const q=ta;ta=tb;tb=q}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1){ok=false;break}}}
    if(ok&&t0<tmin)tmin=t0}
  return tmin;
}

function animPerson(R,dt,spd,pose,t){
  const k=Math.min(1,dt*12);
  let hy=.95,lean=0,L=[0,0],K=[0,0],A=[0,0],E=[.25,.25],hx=0;
  if(pose==='crouch'){hy=.52;L=[1.45,1.45];K=[-1.9,-1.9];lean=-.35;A=[1.15+Math.sin(t*9)*.25,1.15-Math.sin(t*9)*.25];E=[.5,.5]}
  else if(pose==='sleep'){hy=.3;lean=0}
  else{
    if(spd>.1)R.ph+=dt*(spd<3.5?spd*2.9:spd*2.2);
    const amp=clamp(spd/2.8,0,1)*.5+clamp((spd-2.8)/2.8,0,1)*.35,ph=R.ph;
    L=[Math.sin(ph)*amp,-Math.sin(ph)*amp];K=[-Math.max(0,Math.sin(ph+1.4))*amp*1.7-.05,-Math.max(0,Math.sin(ph+1.4+Math.PI))*amp*1.7-.05];
    A=[-Math.sin(ph)*amp*.9,Math.sin(ph)*amp*.9];E=[.25+amp*.6,.25+amp*.6];lean=-amp*.22;hy=.95+Math.abs(Math.cos(ph))*.035*amp-amp*.03;
    if(spd<.1){const b=Math.sin(t*1.7)*.012;hy+=b;A=[.05+b,.05+b]}
    if(pose==='sack'){A[0]=2.7;E[0]=2.2}else if(pose==='bale'){A=[1.05,1.05];E=[.7,.7]}else if(pose==='pour'){A=[1.9,1.9];E=[.3,.3];lean=-.15}else if(pose==='pick'){lean=-.5;A=[1,1];E=[.2,.2]}
  }
  R.hips.position.y=lerp(R.hips.position.y,hy,k);R.torso.rotation.z=lerp(R.torso.rotation.z,lean,k);
  for(let i=0;i<2;i++){R.leg[i].rotation.z=lerp(R.leg[i].rotation.z,L[i],k);R.knee[i].rotation.z=lerp(R.knee[i].rotation.z,K[i],k);R.arm[i].rotation.z=lerp(R.arm[i].rotation.z,A[i],k);R.elbow[i].rotation.z=lerp(R.elbow[i].rotation.z,E[i],k);R.arm[i].rotation.x=lerp(R.arm[i].rotation.x,(i?1:-1)*(pose==='bale'?.25:.06),k)}
}

const pickables=[];
function bInside(B,x,z,m=0){return x>B.x0+m&&x<B.x1-m&&z>B.z0+m&&z<B.z1-m}
function doorPts(B,d){const o=1.1;switch(d.side){case's':return [[d.c,B.z1+o],[d.c,B.z1-o]];case'n':return [[d.c,B.z0-o],[d.c,B.z0+o]];case'e':return [[B.x1+o,d.c],[B.x1-o,d.c]];default:return [[B.x0-o,d.c],[B.x0+o,d.c]]}}
function planPath(pid,x,z,tx,tz){const B=PENS[pid].bld;if(!B||B.open)return [[tx,tz]];const ai=bInside(B,x,z),ti=bInside(B,tx,tz);if(ai===ti)return [[tx,tz]];
  let best=null,bd=1e9;for(const d of B.doors){const [o,i]=doorPts(B,d);const dd=Math.hypot(o[0]-tx,o[1]-tz)+Math.hypot(o[0]-x,o[1]-z);if(dd<bd){bd=dd;best=[o,i]}}
  return ai?[best[1],best[0],[tx,tz]]:[best[0],best[1],[tx,tz]]}
function penRandPos(pid,m=.9,inside){const P=PENS[pid],B=P.bld;if(inside&&B)return [rand(B.x0+m,B.x1-m),rand(B.z0+m+(pid==='kumes'?.6:0),B.z1-m)];return [P.x+rand(-P.w/2+m,P.w/2-m),P.z+rand(-P.d/2+m,P.d/2-m)]}
function spawnVis(a){
  const R=makeModel(a.t,a.c);R.g.position.set(a.x,0,a.z);const h=rand(6.3);R.g.rotation.y=-h;
  R.g.traverse(o=>{o.userData.aid=a.id});scene.add(R.g);pickables.push(R.g);
  a._v={R,h,path:[],wait:rand(3),ph:rand(6),goal:null,eat:0,graze:0,ic:null,icKey:'',stuck:0,lastD:1e9,hold:0};
}
function killVis(a){if(!a._v)return;scene.remove(a._v.R.g);const i=pickables.indexOf(a._v.R.g);if(i>=0)pickables.splice(i,1);if(a._v.ic)a._v.ic.remove();a._v=null}
function setTarget(a,tx,tz){const v=a._v;v.path=planPath(AT[a.t].pen,a.x,a.z,tx,tz);v.stuck=0;v.lastD=1e9}
function updateAnimalVis(a,dt,night){
  const v=a._v;if(!v)return;const d=AT[a.t],R=v.R,pid=d.pen,P=PENS[pid];
  let moving=false;
  if(v.hold>0){v.hold-=dt;v.graze=0}
  else if(v.eat>0)v.eat-=dt;
  else if(!v.path.length){
    if(v.goal){if(v.goal==='feed'){eat(a);v.eat=rand(3,5)}else if(v.goal==='water'){drink(a);v.eat=rand(2,3)}v.goal=null;v.wait=rand(1.5,6)}
    else if((v.wait-=dt)<=0){
      if(Math.random()<(night?.6:.72)){const [x,z]=penRandPos(pid,.9,night&&pid!=='agil'?true:Math.random()<.15);setTarget(a,x,z)}else v.wait=rand(2,6);
      if(R.kind!=='chicken'&&R.kind!=='goose'&&Math.random()<.4&&!night)v.graze=rand(2,5);v.wait=v.wait>0?v.wait:rand(2,7)*(night?2.5:1)}
  }else{
    const [tx,tz]=v.path[0];const dx=tx-a.x,dz=tz-a.z,dist=Math.hypot(dx,dz);
    if(dist<.3){v.path.shift();v.stuck=0;v.lastD=1e9}
    else{const want=Math.atan2(dz,dx);v.h=angLerp(v.h,want,Math.min(1,dt*4));const df=Math.abs(Math.atan2(Math.sin(want-v.h),Math.cos(want-v.h)));
      const sp=d.hiz*(night?.6:1)*(df>1?.3:1)*(v.goal?1.25:1);a.x+=Math.cos(v.h)*sp*dt;a.z+=Math.sin(v.h)*sp*dt;moving=true;
      v.stuck+=dt;if(v.stuck>1.5){if(dist>v.lastD-.25){v.path=[];if(!v.goal)v.wait=rand(.5,2);else{v.goal=null;v.wait=.5}}v.stuck=0;v.lastD=dist}}
  }
  a.x=clamp(a.x,P.x-P.w/2+.45,P.x+P.w/2-.45);a.z=clamp(a.z,P.z-P.d/2+.45,P.z+P.d/2-.45);
  [a.x,a.z]=collide(a.x,a.z,d.r*.75,penCols[pid]);
  R.g.position.set(a.x,0,a.z);R.g.rotation.y=-v.h;
  const nearP=Math.abs(a.x-PL.x)<22&&Math.abs(a.z-PL.z)<22;if(v.cs!==nearP){v.cs=nearP;R.g.traverse(o=>{if(o.isMesh)o.castShadow=nearP})}
  v.ph+=dt*(moving?d.hiz*7*(R.kind==='chicken'?1.8:1):0);
  const sw=moving?Math.sin(v.ph)*.55:0;
  if(R.legs.length===4){R.legs[0].rotation.z=sw;R.legs[3].rotation.z=sw;R.legs[1].rotation.z=-sw;R.legs[2].rotation.z=-sw}
  else if(R.legs.length===2){R.legs[0].rotation.z=sw;R.legs[1].rotation.z=-sw}
  R.body.position.y=moving?Math.abs(Math.cos(v.ph))*.03:0;
  let hr=0;const t=performance.now()/1000;
  if(v.eat>0||v.graze>0){if(v.graze>0)v.graze-=dt;hr=(R.kind==='chicken'||R.kind==='goose')?-.7-Math.abs(Math.sin(t*9))*.5:-.85+Math.sin(t*3)*.08}
  else if(R.kind==='chicken'&&!moving)hr=Math.sin(t*2+a.id)*.15+(Math.sin(t*.7+a.id*3)>.7?-.9:0);
  else if(v.hold>0)hr=Math.sin(t*1.5)*.1+.1;
  else hr=Math.sin(t*.8+a.id)*.08;
  R.head.rotation.z=lerp(R.head.rotation.z,hr,Math.min(1,dt*8));
  if(R.tail)R.tail.rotation.x=Math.sin(t*2.2+a.id)*.35;
  if(R.wool&&d.yun){const s=a.wr?1:.72+.28*clamp(a.wp/d.yun.aralik,0,1);R.wool.scale.set(1,s*.9+.1,s)}
}
function goTo(a,goal){const v=a._v,P=PENS[AT[a.t].pen],F=goal==='feed'?P.fd:P.tr,L=F.l*.42;
  v.goal=goal;setTarget(a,F.x+rand(-L,L),F.z+F.s*(.6+AT[a.t].r*.85));v.wait=0;v.eat=0;v.graze=0}
function separate(){
  const by={};for(const a of S.animals){if(!a._v)continue;(by[AT[a.t].pen]||(by[AT[a.t].pen]=[])).push(a)}
  for(const k in by){const L=by[k];for(let i=0;i<L.length;i++){const A=L[i];
    const pdx=A.x-PL.x,pdz=A.z-PL.z,pd=Math.hypot(pdx,pdz),pm=AT[A.t].r*.8+.35;if(pd<pm&&pd>1e-4){A.x+=pdx/pd*(pm-pd);A.z+=pdz/pd*(pm-pd)}
    for(let j=i+1;j<L.length;j++){const B=L[j],dx=B.x-A.x,dz=B.z-A.z,d=Math.hypot(dx,dz),m=AT[A.t].r+AT[B.t].r;if(d<m&&d>1e-4){const p=(m-d)/d*.25;A.x-=dx*p;A.z-=dz*p;B.x+=dx*p;B.z+=dz*p}}}}
}

const humans=[];
const NPC=mkPerson({shirt:'#e9e1cf',pants:'#4a4038',apron:'#7b2d26',hat:'cap',capCol:'#7b2d26',beard:1,hair:'#2a2420'});NPC.g.position.set(1,0,41);NPC.g.rotation.y=Math.PI;scene.add(NPC.g);
function poiList(){const L=[[-19,18],[0,0],[-7.6,4],[31,-16]];for(const id of PEN_IDS){if(!S.pens[id].un)continue;const P=PENS[id];const fz=P.z+P.front*(P.d/2+1.4);L.push([P.x-3.5,fz],[P.x+3.5,fz])}return L}
function syncHumans(){
  const want=[];for(const k in WK)for(let i=0;i<S.wk[k];i++)want.push(k);
  while(humans.length>want.length){const h=humans.pop();scene.remove(h.R.g)}
  for(let i=0;i<want.length;i++){if(humans[i]&&humans[i].k===want[i])continue;if(humans[i])scene.remove(humans[i].R.g);
    const k=want[i];const R=mkPerson({shirt:WK[k].shirt,hat:k==='veteriner'?null:'cap',capCol:WK[k].shirt,pants:k==='veteriner'?'#6a7a8a':'#4a4a40',hair:pick(['#2a1e16','#5a3a22','#1a1410'])});

}
function updateHumans(dt,t){for(const H of humans){let sp=0;if(H.wait>0){H.wait-=dt;if(H.wait<=0){const [x,z]=pick(poiList());H.tx=x+rand(-1,1);H.tz=z+rand(-.5,.5)}}else{const dx=H.tx-H.x,dz=H.tz-H.z,d=Math.hypot(dx,dz);if(d<.25)H.wait=rand(2,6);else{H.h=angLerp(H.h,Math.atan2(dz,dx),Math.min(1,dt*5));H.x+=Math.cos(H.h)*1.5*dt;H.z+=Math.sin(H.h)*1.5*dt;sp=1.5;[H.x,H.z]=collide(H.x,H.z,.3,WALLCOL)}}
  H.R.g.position.set(H.x,getH(H.x,H.z),H.z);H.R.g.rotation.y=-H.h;animPerson(H.R,dt,sp,H.wait>0&&H.wait<2.5?'pick':'',t)}
  animPerson(NPC,dt,0,'',t);}

/* ================= simülasyon ================= */
const cnt=t=>S.animals.filter(a=>a.t===t).length;
const penCount=pid=>S.animals.filter(a=>AT[a.t].pen===pid).length;
const penCap=pid=>PENS[pid].cap[S.pens[pid].lvl];
const depoCap=()=>DEPO[S.depo];
const depoUsed=()=>{let s=0;for(const k in S.prod)s+=S.prod[k];return s};
const hour=()=>S.t*24;
const isNight=()=>{const h=hour();return h<5.5||h>=20.5};
function addProd(k,n){const room=depoCap()-depoUsed();const add=Math.min(n,Math.max(0,room));if(add<=0)return 0;S.prod[k]=Math.round((S.prod[k]+add)*10)/10;return add}
function eat(a){const d=AT[a.t],p=S.pens[d.pen];if(p.feed>=d.ogun){p.feed-=d.ogun;a.hu=Math.min(100,a.hu+50)}}
function drink(a){const d=AT[a.t],p=S.pens[d.pen];if(p.water>=d.su){p.water-=d.su;a.th=Math.min(100,a.th+55)}}
const wt={b:0,s:0,v:0};let LIVE=false,READY=false;
function sim(dt,live){
  LIVE=live;const prevT=S.t;S.t+=dt/DAY;
  if(prevT<.75&&S.t>=.75&&S.wk.pazarci)sellAll(.05,true);
  if(S.t>=1){S.t-=1;newDay()}
  const k=isNight()?.5:1;
  for(const id of PEN_IDS){const p=S.pens[id];if(p.un&&p.auto)p.water=PENS[id].waterCap}
  for(const a of [...S.animals]){
    const d=AT[a.t],p=S.pens[d.pen];
    a.hu=Math.max(0,a.hu-.4*k*dt);a.th=Math.max(0,a.th-.5*k*dt);a.ag+=dt;
    const busy=live&&a._v&&(a._v.goal||a._v.hold>0);
    if(!busy){
      if(a.hu<60&&p.feed>=d.ogun){if(live&&a._v)goTo(a,'feed');else eat(a)}
      else if(a.th<60&&p.water>=d.su){if(live&&a._v)goTo(a,'water');else drink(a)}
    }
    if(a.hu<=0||a.th<=0)a.hp-=.07*dt;else if(!a.sick)a.hp=Math.min(100,a.hp+.04*dt);
    a.hp=Math.max(0,a.hp);
    if(a.hp<30&&!a.sick){a.sick=1;if(live)toast(`🤒 ${a.n} (${d.ad}) hastalandı! Veteriner gerekiyor.`)}
    const ok=!a.sick&&a.hu>25&&a.th>25,mood=(a.hu+a.th+a.hp)/300,rate=dt*(.5+mood*.7);
    if(d.buyur&&a.ag>=d.buyume){grow(a,live);continue}
    if(ok&&d.urun&&!a.rd){a.pr+=rate;if(a.pr>=d.aralik){a.pr=0;
      if(a.t==='tavuk'){if(p.eggs+p.geggs<60)p.eggs++}else if(a.t==='kaz'){if(p.eggs+p.geggs<60)p.geggs++}else a.rd=1}}
    if(ok&&d.yun&&!a.wr){a.wp+=rate;if(a.wp>=d.yun.aralik)a.wr=1}
    if(ok&&d.gelir){a.pr+=rate;if(a.pr>=d.gelir.aralik){a.pr=0;S.money+=d.gelir.miktar;if(live)floatAt(a,'+'+tl(d.gelir.miktar)+' 🏇')}}
    if(ok&&d.yavru&&a.hp>60&&a.hu>40){a.br+=rate;if(a.br>=d.dogum){if(penCount(d.pen)<penCap(d.pen)){a.br=0;birth(a,live)}else{a.br=d.dogum;if(live&&!a.fullWarn){a.fullWarn=1;toast(`🍼 ${a.n} doğuruma hazır ama ${PENS[d.pen].ad} dolu. Bölmeyi genişlet!`)}}}}
  }
  workerSim(dt,live);
}
function workerSim(dt){
  const W=S.wk;
  if(W.bakici){wt.b+=dt;const iv=4/W.bakici;while(wt.b>=iv){wt.b-=iv;bakiciJob()}}else wt.b=0;
  if(W.sagimci){wt.s+=dt;const iv=2.5/W.sagimci;while(wt.s>=iv){wt.s-=iv;sagimciJob()}}else wt.s=0;
  if(W.veteriner){wt.v+=dt;if(wt.v>=5){wt.v=0;const a=S.animals.find(a=>a.sick);if(a)heal(a,0)}}
}
let feedWarnDay=0;
function bakiciJob(){
  for(const id of PEN_IDS){const p=S.pens[id],P=PENS[id];if(!p.un)continue;
    if(p.water<P.waterCap*.5){p.water=P.waterCap;return}
    if(p.feed<P.feedCap*.5&&penCount(id)){if(S.feed[P.feed]>0){const take=Math.min(P.feedCap-p.feed,S.feed[P.feed]);S.feed[P.feed]=Math.round((S.feed[P.feed]-take)*100)/100;p.feed+=take;return}else if(feedWarnDay!==S.day&&LIVE){feedWarnDay=S.day;toast(`🧑‍🌾 Bakıcı: "Ambarda ${FEED[P.feed].ad.toLowerCase()} kalmadı patron!"`)}}}
}
function sagimciJob(){
  for(const id of PEN_IDS){const p=S.pens[id];if(p.eggs+p.geggs>0&&depoUsed()<depoCap()){collectEggs(id,true);return}}
  const a=S.animals.find(a=>a.rd&&!a.sick)||S.animals.find(a=>a.wr);
  if(a&&depoUsed()<depoCap()){if(a.rd)milk(a,true);else shear(a,true)}
}
function newDay(){
  S.day++;let wages=0;for(const k in WK)wages+=WK[k].maas*S.wk[k];
  const quit=[];
  while(wages>0&&S.money<wages){const ks=Object.keys(WK).filter(k=>S.wk[k]>0).sort((a,b)=>WK[b].maas-WK[a].maas);if(!ks.length)break;S.wk[ks[0]]--;wages-=WK[ks[0]].maas;quit.push(WK[ks[0]].ad)}
  S.money-=wages;
  for(const k in PR)S.pm[k]=clamp(S.pm[k]*rand(.86,1.16)*(1+(1-S.pm[k])*.3),.7,1.4);
  if(LIVE){toast(`🌅 Gün ${S.day} başladı${wages?` · Maaşlar: -${tl(wages)}`:''}`);if(quit.length)toast(`😞 Maaş ödenemedi: ${quit.join(', ')} işi bıraktı.`)}
  if(quit.length)syncHumans();
}
function grow(a,live){const d=AT[a.t];const old=d.ad;a.t=d.buyur;a.pr=rand(AT[a.t].aralik||10)*.3;a.br=0;a.rd=0;a.wr=0;a.wp=0;
  if(a._v){killVis(a);spawnVis(a)}if(live){toast(`🎉 ${old} ${a.n} büyüdü, artık bir ${AT[a.t].ad.toLowerCase()}!`);if(SEL===a.id)renderCard()}}
function newAnimal(t,x,z){const d=AT[t];return {id:S.nid++,t,n:pick(NAMES),c:irand(20),x,z,hu:85,th:85,hp:100,pr:rand(0,(d.aralik||d.gelir?.aralik||10)*.5),rd:0,wp:0,wr:0,ag:d.genc?0:DAY*rand(3,8),br:rand(0,(d.dogum||1)*.3),sick:0}}
function birth(par,live){const d=AT[par.t];const b=newAnimal(d.yavru,par.x+rand(-.6,.6),par.z+rand(-.6,.6));b.ag=0;b.hu=100;b.th=100;b.br=0;S.animals.push(b);S.stats.born++;
  if(READY)spawnVis(b);if(live){toast(`🍼 ${par.n} bir ${AT[b.t].ad.toLowerCase()} doğurdu! Adı: ${b.n}`);floatAt(b,'🎉')}}

/* ================= eylemler ================= */
function canPay(n){if(S.money>=n)return true;toast('💸 Paran yetmiyor!');return false}
function buyAnimal(t){const d=AT[t],pid=d.pen;if(!S.pens[pid].un)return toast(`🔒 Önce ${PENS[pid].ad} açılmalı.`);if(penCount(pid)>=penCap(pid))return toast(`${PENS[pid].ad} dolu! Telefondan genişletebilirsin.`);if(!canPay(d.fiyat))return;
  S.money-=d.fiyat;const [x,z]=penRandPos(pid);const a=newAnimal(t,x,z);S.animals.push(a);spawnVis(a);toast(`${d.e} ${a.n} adında bir ${d.ad.toLowerCase()} aldın! Hayvan ${PENS[pid].ad.toLowerCase()} bölmesine teslim edildi.`);refresh()}
function buyFeed(k,i){const [kg,pr]=FEED[k].paket[i];if(S.feed[k]+kg>FEED[k].cap)return toast(`Ambar dolu (en fazla ${FEED[k].cap} kg).`);if(!canPay(pr))return;S.money-=pr;S.feed[k]+=kg;toast(`${FEED[k].e} ${kg} kg ${FEED[k].ad.toLowerCase()} yem ambarına teslim edilecek.`);refresh()}
function collectEggs(pid,silent){const p=S.pens[pid];if(p.eggs+p.geggs<=0)return;let a=addProd('yumurta',p.eggs);p.eggs-=a;let b=addProd('kazYumurta',p.geggs);p.geggs-=b;S.stats.eggs+=a+b;
  if(!silent){if(a+b<=0)return toast('📦 Depo dolu! Pazarda ürün sat ya da depoyu büyüt.');floatWorld(penObj[pid].nest.clone().setY(1.6),`+${a+b} 🥚`);refresh()}}
function milk(a,silent){if(!a.rd)return;const d=AT[a.t];const amt=d.miktar*(S.sagimMak?1.3:1);const got=addProd(d.urun,amt);if(got<=0){if(!silent)toast('📦 Depo dolu! Pazarda ürün sat ya da depoyu büyüt.');return}
  a.rd=0;S.stats.milk+=got;S.stats.milkings++;if(LIVE&&a._v)floatAt(a,`+${f1(got)} L 🥛`);if(!silent)refresh()}
function shear(a,silent){if(!a.wr)return;const got=addProd('yun',AT[a.t].yun.miktar);if(got<=0){if(!silent)toast('📦 Depo dolu!');return}a.wr=0;a.wp=0;S.stats.wool+=got;if(LIVE&&a._v)floatAt(a,`+${f1(got)} kg 🧶`);if(!silent)refresh()}
function heal(a,cost){if(!a.sick)return;if(cost&&!canPay(cost))return;S.money-=cost;a.sick=0;a.hp=80;a.hu=Math.max(a.hu,40);a.th=Math.max(a.th,40);if(LIVE){toast(`🧑‍⚕️ ${a.n} iyileşti!`);if(a._v)floatAt(a,'💚')}refresh()}
function animalValue(a){const d=AT[a.t];return Math.round(d.fiyat*(a.sick?.3:.65)*(.5+a.hp/200))}
function sellAnimal(a){const v=animalValue(a);S.money+=v;killVis(a);S.animals=S.animals.filter(x=>x!==a);toast(`${AT[a.t].e} ${a.n} satıldı: +${tl(v)}`);deselect();refresh()}
function price(k){return PR[k].f*S.pm[k]}
function sell(k,fee=0){const n=S.prod[k];if(n<=0)return 0;const m=n*price(k)*(1-fee);S.money+=m;S.stats.sold+=m;S.prod[k]=0;return m}
function sellAll(fee,auto){let m=0;for(const k in PR)m+=sell(k,fee);if(m>0&&LIVE)toast(auto?`🧔 Pazarcı ürünleri sattı: +${tl(m)}`:`💰 Hepsi satıldı: +${tl(m)}`);if(!auto&&m<=0)toast('Depoda satılacak ürün yok.');refresh();return m}
function unlockPen(pid){const P=PENS[pid];if(S.pens[pid].un)return;if(!canPay(P.unlock))return;S.money-=P.unlock;S.pens[pid].un=1;penObj[pid].sign.visible=false;toast(`🎉 ${P.ad} artık senin!`);refresh()}
function upgradePen(pid){const p=S.pens[pid],P=PENS[pid];if(p.lvl>=P.cap.length-1)return;const c=P.capCost[p.lvl+1];if(!canPay(c))return;S.money-=c;p.lvl++;toast(`🔨 ${P.ad} genişletildi: ${penCap(pid)} hayvan kapasitesi.`);S.animals.forEach(a=>a.fullWarn=0);refresh()}
function buyAuto(pid){const p=S.pens[pid],P=PENS[pid];if(p.auto)return;if(!canPay(P.autoCost))return;S.money-=P.autoCost;p.auto=1;toast(`🚰 ${P.ad} için otomatik suluk kuruldu.`);refresh()}
function upgradeDepo(){if(S.depo>=DEPO.length-1)return;const c=DEPO_COST[S.depo+1];if(!canPay(c))return;S.money-=c;S.depo++;toast(`📦 Depo büyütüldü: ${depoCap()} birim.`);refresh()}
function buySagimMak(){if(S.sagimMak)return;if(!canPay(SAGIM_MAK))return;S.money-=SAGIM_MAK;S.sagimMak=1;toast('⚙️ Sağım makinesi kuruldu: %30 daha fazla süt!');refresh()}
function hire(k){const w=WK[k];if(S.wk[k]>=w.max)return;if(!canPay(w.ucret))return;S.money-=w.ucret;S.wk[k]++;toast(`${w.e} Yeni ${w.ad.toLowerCase()} işe başladı!`);syncHumans();refresh()}
function fire(k){if(S.wk[k]<=0)return;S.wk[k]--;toast(`${WK[k].e} Bir ${WK[k].ad.toLowerCase()} işten ayrıldı.`);syncHumans();refresh()}

function nearSeg(x0,z,l,px,pz){return segDist(px,pz,x0-l/2,z,x0+l/2,z)}
function findAction(){
  const px=PL.x,pz=PL.z,fx=Math.cos(PL.h),fz=Math.sin(PL.h);let best=null,bs=1e9;
  const C=(dist,range,o,pen=0)=>{if(dist>range)return;const s=dist+pen+(o.dis?.6:0);if(s<bs){bs=s;best=o}};
  const car=S.carry;
  for(const id of PEN_IDS){const P=PENS[id],p=S.pens[id],o=penObj[id];
    if(!p.un){C(Math.hypot(px-o.signPos[0],pz-o.signPos[1]),2.6,{i:'🔒',l:`Satın al: ${P.ad} · ${tl(P.unlock)}`,dis:S.money<P.unlock,run:()=>unlockPen(id)});continue}
    const F=P.fd,dF=nearSeg(F.x,F.z,F.l,px,pz);
    if(car){if(car.k===P.feed){if(p.feed<P.feedCap-.05)C(dF,1.7,{i:FEED[car.k].e,l:`Yemliğe dök (${f1(Math.min(car.kg,P.feedCap-p.feed))} kg)`,dur:1.3,pose:'pour',run:()=>{const t=Math.min(car.kg,P.feedCap-p.feed);p.feed+=t;car.kg-=t;S.stats.fed++;floatWorld(o.fpos.clone().setY(1.3),`+${f1(t)} kg ${FEED[car.k].e}`);if(car.kg<.01)S.carry=null}});else C(dF,1.7,{i:'✅',l:'Yemlik dolu',dis:1})}
      else C(dF,1.7,{i:'❌',l:`Bu yemliğe ${FEED[P.feed].ad.toLowerCase()} lazım`,dis:1})}
    else C(dF,1.7,{i:FEED[P.feed].e,l:`Yemlik %${Math.round(p.feed/P.feedCap*100)} · ambardan ${FEED[P.feed].ad.toLowerCase()} getir`,dis:1});
    const T=P.tr,dT=nearSeg(T.x,T.z,T.l,px,pz);
    if(!p.auto&&p.water<P.waterCap-.5)C(dT,1.7,{i:'💧',l:'Musluğu aç, suluğu doldur',dur:1.6,pose:'pick',run:()=>{p.water=P.waterCap;S.stats.water++;floatWorld(o.wpos.clone().setY(1.3),'💧 Doldu')}});
    else C(dT,1.7,{i:'💧',l:p.auto?'Otomatik suluk':'Suluk dolu',dis:1});
    if(id==='kumes'){const e=p.eggs+p.geggs;C(nearSeg(o.nest.x,o.nest.z+.6,5.4,px,pz),1.5,e?{i:'🥚',l:`Yumurtaları topla (${e})`,dur:1.1,pose:'pick',run:()=>collectEggs(id)}:{i:'🥚',l:'Follukta yumurta yok',dis:1})}

  sun.position.set(lt.x+sd.x*70,sd.y*70+lt.y,lt.z+sd.z*70);sun.target.position.copy(lt);
  if(e>0){sun.intensity=2.9*smooth(-.03,.15,e);sun.color.setRGB(1,lerp(.62,.95,day),lerp(.42,.85,day))}else{sun.intensity=.4*smooth(0,-.2,e);sun.color.setRGB(.6,.7,1)}
  hemi.intensity=lerp(.6,.95,dusk*.35+day*.65);hemi.color.setRGB(lerp(.5,.82,day),lerp(.6,.9,day),lerp(.95,1,day));
  stars.material.opacity=smooth(0,-.2,e);
  const wn=smooth(.15,-.05,e);for(const m of winMats)m.emissiveIntensity=wn*1.5;
  if(inside&&wn>0){hemi.intensity+=.55*wn;hemi.color.lerp(new THREE.Color(1,.78,.5),wn*.6)}
  const hb=BUILDINGS.find(b=>b.fire);if(hb)hb.fire.scale.y=.18+Math.sin(t*13)*.04;
  for(const c of clouds){c.material.color.setRGB(lerp(.25,1,dusk*.3+day*.7),lerp(.28,1,dusk*.2+day*.8),lerp(.4,1,day));c.position.x+=.4/60;if(c.position.x>340)c.position.x=-340}
  renderer.toneMappingExposure=lerp(1.25,1.05,day);
}

/* ================= döngü ================= */
let last=performance.now(),hudT=0,saveT=0,sepT=0,miniT=0,actT=0,fpsT=0,fpsN=0,slow=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;windU.value=t;
  sim(dt,true);
  updatePlayer(dt,t);
  const night=isNight();for(const a of S.animals)updateAnimalVis(a,dt,night);
  sepT+=dt;if(sepT>.05){sepT=0;separate()}
  updateHumans(dt,t);
  for(const id of PEN_IDS){const o=penObj[id],p=S.pens[id],P=PENS[id];const fl=clamp(p.feed/P.feedCap,0,1),wl=clamp(p.water/P.waterCap,0,1);
    o.food.scale.y=Math.max(.001,.3*fl);o.food.position.y=.48+.15*fl;o.food.visible=fl>.01;o.water.scale.y=Math.max(.001,.3*wl);o.water.position.y=.36+.15*wl;o.water.visible=wl>.01;
    if(o.eggs){const n=Math.min(p.eggs,25),g=Math.min(p.geggs,5);let ni=0,gi=0;o.eggs.forEach((e,i)=>{if(i%6===5)e.visible=gi++<g;else e.visible=ni++<n})}}
  const ns=Math.min(24,Math.ceil(S.feed.tahil/25)),nb=Math.min(24,Math.ceil(S.feed.saman/40));ambarVis.sacks.forEach((s,i)=>s.visible=i<ns);ambarVis.bales.forEach((s,i)=>s.visible=i<nb);
  const sa=S.animals.find(a=>a.id===SEL);if(sa&&sa._v){ring.position.set(sa.x,.04,sa.z);ring.scale.setScalar(AT[sa.t].r*1.4);ring.material.opacity=.6+Math.sin(now/200)*.25}
  updateCamera(dt);updateSky(t);updateIcons();
  actT+=dt;if(actT>.1){actT=0;curAct=findAction()}updateActionUI();
  miniT+=dt;if(miniT>.1){miniT=0;drawMini(t)}
  hudT+=dt;if(hudT>.5){hudT=0;updateHUD();checkQuest();if(!pdown){if(UI.p)renderSheet();if(SEL)renderCard()}}
  saveT+=dt;if(saveT>5){saveT=0;save()}
  renderer.render(scene,camera);
  fpsT+=dt;fpsN++;if(fpsT>2){const fps=fpsN/fpsT;fpsT=0;fpsN=0;
    if(fps<40&&curPR>.75){curPR=Math.max(.75,curPR-.25);renderer.setPixelRatio(curPR);renderer.setSize(innerWidth,innerHeight)}
    else if(fps>57&&curPR<MAXPR){curPR=Math.min(MAXPR,curPR+.25);renderer.setPixelRatio(curPR);renderer.setSize(innerWidth,innerHeight)}
    if(fps<24&&curPR<=.75&&sun.castShadow){if(++slow>=2){sun.castShadow=false;toast('⚙️ Oyun akıcı olsun diye gölgeler kapatıldı.')}}else slow=0}
}

/* ================= başlat ================= */
for(const id of PEN_IDS)penObj[id].sign.visible=!S.pens[id].un;
for(const a of S.animals){const P=PENS[AT[a.t].pen];if(Math.abs(a.x-P.x)>P.w/2||Math.abs(a.z-P.z)>P.d/2){const [x,z]=penRandPos(AT[a.t].pen);a.x=x;a.z=z}}
{const away=Math.min(1800,(Date.now()-(S.savedAt||Date.now()))/1000);
 if(away>20&&S.animals.length){const m0=S.money;let r=away;while(r>0){const st=Math.min(1,r);sim(st,false);r-=st}
   setTimeout(()=>toast(`⏳ Sen yokken çiftlik ${Math.round(away/60)} dakika çalıştı.${S.money!==m0?` Kasa: ${S.money>m0?'+':''}${tl(S.money-m0)}`:''}`),800)}}
for(const a of S.animals)spawnVis(a);READY=true;
syncHumans();drawMiniBg();updateHUD();checkQuest();
addEventListener('visibilitychange',()=>{if(document.hidden)save();else last=performance.now()});
addEventListener('pagehide',save);
window.__farmStarted=true;$('loading').remove();
if(!S.welcomed)welcome();
requestAnimationFrame(frame);
window.__farm={get info(){const i=renderer.info;let objs=0;scene.traverse(()=>objs++);return {calls:i.render.calls,tris:i.render.triangles,objs,geos:i.memory.geometries,pr:renderer.getPixelRatio()}},renderer,get S(){return S},AT,PENS,PL,cam,sim,buyAnimal,findAction,doAction,camera,keys,joy,openSheet};
</script>
